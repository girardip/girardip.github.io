<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Schedario — Siti d'Esame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --paper: #EDE7D8;
  --paper-deep: #E4DCC8;
  --card: #FBF8F1;
  --ink: #262019;
  --ink-soft: #55503f;
  --ink-faint: #8a8270;
  --rule: #d8cdb0;
  --sienna: #A8552E;
  --sienna-deep: #8A4324;
  --verdigris: #5C7A6E;
  --verdigris-deep: #445c53;
  --stamp: #8B3A3A;
  --gold: #B8963E;
  --shadow: 0 1px 2px rgba(38,32,25,0.06), 0 8px 24px -12px rgba(38,32,25,0.25);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--paper);
  background-image:
    radial-gradient(circle at 15% 8%, rgba(168,85,46,0.05), transparent 40%),
    radial-gradient(circle at 85% 92%, rgba(92,122,110,0.06), transparent 45%);
  color:var(--ink);
  font-family:'Source Sans 3', sans-serif;
  -webkit-font-smoothing:antialiased;
}

::selection{ background:var(--gold); color:var(--ink); }

.app{ min-height:100vh; display:flex; flex-direction:column; }

/* ---------- TOPBAR ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  background:var(--paper);
  border-bottom:1px solid var(--rule);
  padding:14px 16px 0 16px;
}
.topbar-inner{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:12px;
}
.brand{ display:flex; align-items:center; gap:10px; }
.brand-mark{
  font-family:'Fraunces', serif; font-weight:600; font-size:26px;
  color:var(--sienna); line-height:1;
  width:34px; height:34px; border:1.5px solid var(--sienna);
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.brand-text{ display:flex; flex-direction:column; line-height:1.15; }
.brand-title{ font-family:'Fraunces', serif; font-weight:600; font-size:17px; letter-spacing:0.01em; }
.brand-sub{ font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--ink-faint); letter-spacing:0.03em; margin-top:2px; }

.counter{
  font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--ink-soft);
  display:flex; align-items:baseline; gap:4px; white-space:nowrap;
}
#visibleCount{ font-weight:600; font-size:14px; color:var(--sienna); }
.counter-label{ color:var(--ink-faint); }

.searchbar{
  position:relative;
  display:flex; align-items:center; gap:8px;
  background:var(--card);
  border:1px solid var(--rule);
  border-bottom:none;
  border-radius:10px 10px 0 0;
  padding:10px 12px;
  margin-top:2px;
}
.search-icon{ color:var(--ink-faint); flex-shrink:0; }
#searchInput{
  flex:1; border:none; background:transparent; outline:none;
  font-family:'Source Sans 3', sans-serif; font-size:15px; color:var(--ink);
}
#searchInput::placeholder{ color:var(--ink-faint); }
.clear-btn{
  border:none; background:var(--paper-deep); color:var(--ink-soft);
  width:22px; height:22px; border-radius:50%; font-size:16px; line-height:1;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}

/* ---------- LAYOUT ---------- */
.layout{ flex:1; display:flex; flex-direction:column; min-height:0; }

.index{
  background:var(--card);
  border-bottom:8px solid var(--paper-deep);
  max-height:38vh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.index-group-label{
  position:sticky; top:0;
  background:var(--paper-deep);
  color:var(--sienna-deep);
  font-family:'JetBrains Mono', monospace;
  font-size:10.5px; font-weight:600; letter-spacing:0.08em;
  padding:5px 14px;
  z-index:1;
}
.index-item{
  display:flex; align-items:center; gap:10px;
  width:100%; text-align:left;
  padding:11px 14px;
  border:none; border-bottom:1px solid var(--rule);
  background:transparent;
  font-family:'Source Sans 3', sans-serif;
  font-size:14.5px; color:var(--ink);
  cursor:pointer;
}
.index-item .idx-letter{
  font-family:'JetBrains Mono', monospace;
  font-size:10px; color:var(--ink-faint);
  width:16px; flex-shrink:0;
}
.index-item.active{
  background:var(--sienna);
  color:#fff;
}
.index-item.active .idx-letter{ color:rgba(255,255,255,0.75); }
.index-item .hit{ color:var(--sienna); font-weight:600; }
.index-item.active .hit{ color:#fff; text-decoration:underline; }

.index-empty{
  padding:28px 16px; text-align:center;
  color:var(--ink-faint); font-size:13.5px; font-style:italic;
}

/* ---------- STAGE / CARD ---------- */
.stage{
  flex:1;
  padding:20px 14px 60px 14px;
  display:flex; justify-content:center;
}
.empty-state{
  margin-top:14vh;
  text-align:center;
  color:var(--ink-faint);
  font-size:14.5px; line-height:1.6;
}
.empty-mark{
  font-family:'Fraunces', serif; font-size:40px; color:var(--rule);
  margin-bottom:6px;
}

.card{
  width:100%; max-width:640px;
  background:var(--card);
  border:1px solid var(--rule);
  border-radius:4px 14px 14px 14px;
  box-shadow:var(--shadow);
  position:relative;
  padding:26px 22px 30px 22px;
  animation:cardIn 0.28s ease;
}
@keyframes cardIn{
  from{ opacity:0; transform:translateY(6px); }
  to{ opacity:1; transform:translateY(0); }
}

.card-tab{
  position:absolute; top:-13px; left:22px;
  background:var(--sienna);
  color:#fff;
  font-family:'JetBrains Mono', monospace;
  font-size:11px; font-weight:600; letter-spacing:0.05em;
  padding:4px 10px;
  border-radius:4px 4px 0 0;
}

.card-head{ margin-bottom:22px; }
#cardTitle{
  font-family:'Fraunces', serif; font-weight:600; font-style:italic;
  font-size:26px; line-height:1.2; color:var(--ink);
  margin:0 0 10px 0;
}
.card-rule{
  height:2px; width:52px; background:var(--sienna);
  position:relative;
}
.card-rule::after{
  content:''; position:absolute; left:60px; top:0;
  height:2px; width:14px; background:var(--verdigris);
}

.block{ margin-bottom:24px; }
.block:last-child{ margin-bottom:0; }
.block h2{
  display:flex; align-items:center; gap:8px;
  font-family:'JetBrains Mono', monospace;
  font-size:11.5px; font-weight:600; letter-spacing:0.09em; text-transform:uppercase;
  color:var(--ink-soft);
  margin:0 0 10px 0;
}
.block-num{
  color:#fff; background:var(--verdigris);
  font-size:10px; font-weight:600;
  width:20px; height:20px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.block-inquadramento .block-num{ background:var(--sienna); }
.block-aneddoto .block-num{ background:var(--stamp); }

.block p{
  margin:0; font-size:15.5px; line-height:1.62; color:var(--ink);
}

.tag-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
.tag-list li{
  font-size:14.5px; line-height:1.5; color:var(--ink);
  padding:9px 12px;
  background:var(--paper);
  border-left:3px solid var(--gold);
  border-radius:0 6px 6px 0;
}

.check-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
.check-list li{
  position:relative;
  padding-left:22px;
  font-size:15px; line-height:1.55; color:var(--ink);
}
.check-list li::before{
  content:'✓';
  position:absolute; left:0; top:0.5px;
  color:var(--verdigris-deep); font-weight:700; font-size:13px;
}

.chip-list{ list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:8px; }
.chip-list li{
  font-size:13px; line-height:1.4; color:var(--verdigris-deep);
  background:rgba(92,122,110,0.10);
  border:1px solid rgba(92,122,110,0.28);
  padding:6px 11px;
  border-radius:20px;
}

.block-aneddoto{
  background:linear-gradient(135deg, rgba(139,58,58,0.05), rgba(139,58,58,0.02));
  border:1px dashed rgba(139,58,58,0.35);
  border-radius:8px;
  padding:14px 16px;
}
.block-aneddoto p{ font-style:italic; color:var(--ink-soft); }
.block-aneddoto h2{ color:var(--stamp); }

mark{ background:rgba(184,150,62,0.4); color:inherit; border-radius:2px; padding:0 1px; }

/* ---------- SCROLLBAR ---------- */
.index::-webkit-scrollbar{ width:6px; }
.index::-webkit-scrollbar-thumb{ background:var(--rule); border-radius:3px; }

/* ---------- DESKTOP ---------- */
@media (min-width: 860px){
  .topbar{ padding:18px 32px 0 32px; }
  .searchbar{ max-width:480px; margin-left:auto; margin-right:0; border-radius:10px; border-bottom:1px solid var(--rule); margin-bottom:-1px; }
  .topbar-inner{ margin-bottom:14px; }

  .layout{ flex-direction:row; align-items:flex-start; }
  .index{
    width:340px; flex-shrink:0;
    max-height:none;
    height:calc(100vh - 96px);
    position:sticky; top:96px;
    border-bottom:none;
    border-right:1px solid var(--rule);
  }
  .stage{ padding:36px 40px 80px 40px; align-items:flex-start; }
  .card{ padding:38px 44px 44px 44px; }
  #cardTitle{ font-size:32px; }
  .empty-state{ margin-top:22vh; }
}

@media (prefers-reduced-motion: reduce){
  .card{ animation:none; }
}

</style>
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">§</span>
        <div class="brand-text">
          <span class="brand-title">Schedario dei Siti</span>
          <span class="brand-sub">Guida Turistica Nazionale · L. 190/2023</span>
        </div>
      </div>
      <div class="counter"><span id="visibleCount">179</span><span class="counter-label">schede</span></div>
    </div>
    <div class="searchbar">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5.2" stroke="currentColor" stroke-width="1.4"/><line x1="10.8" y1="10.8" x2="14.5" y2="14.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input id="searchInput" type="text" placeholder="Cerca sito, nome proprio, luogo…" autocomplete="off" spellcheck="false">
      <button id="clearSearch" class="clear-btn" aria-label="Cancella ricerca" hidden>&times;</button>
    </div>
  </header>

  <div class="layout">
    <nav class="index" id="indexList" aria-label="Elenco siti">
      <!-- populated by JS -->
    </nav>

    <main class="stage" id="stage">
      <div class="empty-state" id="emptyState">
        <div class="empty-mark">§</div>
        <p>Seleziona un sito dall'elenco<br>oppure cerca per nome.</p>
      </div>
      <article class="card" id="card" hidden>
        <div class="card-tab">
          <span id="cardIndex">000</span>
        </div>
        <header class="card-head">
          <h1 id="cardTitle"></h1>
          <div class="card-rule"></div>
        </header>

        <section class="block block-inquadramento">
          <h2><span class="block-num">01</span>Inquadramento</h2>
          <p id="cardInquadramento"></p>
        </section>

        <section class="block block-nomi">
          <h2><span class="block-num">02</span>Nomi propri fondamentali</h2>
          <ul id="cardNomi" class="tag-list"></ul>
        </section>

        <section class="block block-nonomettere">
          <h2><span class="block-num">03</span>Da non omettere</h2>
          <ul id="cardNonOmettere" class="check-list"></ul>
        </section>

        <section class="block block-collegamenti">
          <h2><span class="block-num">04</span>Collegamenti interdisciplinari</h2>
          <ul id="cardCollegamenti" class="chip-list"></ul>
        </section>

        <section class="block block-aneddoto" id="aneddotoSection">
          <h2><span class="block-num">05</span>Aneddoto</h2>
          <p id="cardAneddoto"></p>
        </section>
      </article>
    </main>
  </div>
</div>

"Il più esteso parco nazionale d'Italia (oltre 190.000 ettari), a cavallo tra Basilicata e Calabria: massiccio calcareo che segna il confine naturale tra i due Appennini, celebre per il pino loricato, conifera relitta che cresce solo qui e sui monti balcanici.", "nomiChiave": ["Pino loricato (Pinus leucodermis) — conifera dalla corteccia a placche, simbolo del parco, alcuni esemplari plurimillenari", "Monte Pollino (2248 m) e Serra Dolcedorme (2267 m, vetta più alta del parco)", "Gole del Raganello — canyon calcareo, meta di torrentismo", "Piani di Pollino e Piano di Ruggio — altipiani carsici di alta quota", "Museo Naturalistico di Rotonda — centro visite dedicato al pino loricato"], "daNonOmettere": ["L'unicità del pino loricato: relitto glaciale che sopravvive solo su poche vette dell'Appennino meridionale e dei Balcani, alcuni esemplari datati oltre 1000 anni", "La collocazione geografica di cerniera tra Appennino meridionale e catena calabra, con biodiversità di transizione", "Il carsismo diffuso: doline, inghiottitoi, gole (Raganello) come elementi caratterizzanti il paesaggio", "Il ruolo del parco nella tutela di specie rare (lupo appenninico, capriolo autoctono del Pollino)"], "collegamenti": ["Botanica e dendrocronologia (pino loricato, alberi plurimillenari)", "Geografia fisica e carsismo appenninico", "Storia della transumanza e pastorizia appenninica", "Sport outdoor e turismo naturalistico (torrentismo nelle Gole del Raganello)"], "aneddoto": "Alcuni esemplari di pino loricato del Pollino, contorti e scavati dal vento sulle creste più esposte, hanno superato secondo le analisi dendrocronologiche i mille anni di età: alberi che erano già vecchi quando la Magna Grecia, poco più a valle, era già solo un ricordo storico."}, "Sassi di Matera": {"inquadramento": "Insediamento rupestre in Basilicata, abitato ininterrottamente dal Neolitico fino agli anni Cinquanta del Novecento, quando la popolazione fu sfollata per le condizioni igienico-sanitarie. Patrimonio UNESCO dal 1993, Matera è stata Capitale Europea della Cultura nel 2019.", "nomiChiave": ["La Civita (rione della cattedrale)", "Denominazione UNESCO: \"I Sassi e il Parco delle Chiese Rupestri di Matera\" (1993)", "Legge 619/1952 (sfollamento)", "Carlo Levi — \"Cristo si è fermato a Eboli\" (1945)", "Cripta del Peccato Originale (affreschi IX sec.)"], "daNonOmettere": ["Distinzione tra la frequentazione preistorica e l'insediamento strutturato medievale", "Il ruolo di Carlo Levi nel dibattito politico sulla \"vergogna nazionale\"", "Le chiese rupestri con affreschi di scuola bizantina", "Matera Capitale Europea della Cultura 2019"], "collegamenti": ["Storia sociale del Novecento italiano (questione meridionale)", "Cinema (Pasolini, \"Il Vangelo secondo Matteo\", 1964, girato tra i Sassi)", "Urbanistica rupestre e sistema dei vicinati"], "aneddoto": "Pasolini scelse i Sassi come set per \"Il Vangelo secondo Matteo\" per la somiglianza con la Gerusalemme del I secolo: un aneddoto che collega in una battuta arte, cinema e geografia simbolica."}, "Costiera Amalfitana: Amalfi, Positano, Ravello": {"inquadramento": "Litorale tirrenico della provincia di Salerno, Patrimonio UNESCO dal 1997: paesaggio culturale che unisce borghi verticali aggrappati alla roccia (Positano, Amalfi, Ravello) a un'economia storica di navigazione, agricoltura terrazzata e turismo internazionale dal Grand Tour a oggi.", "nomiChiave": ["Repubblica Marinara di Amalfi — una delle quattro repubbliche marinare italiane, potenza commerciale mediterranea dal IX all'XI secolo", "Duomo di Amalfi (Sant'Andrea) — facciata arabo-normanna, custodisce le reliquie dell'apostolo Andrea", "Villa Rufolo e Villa Cimbrone (Ravello) — dimore storiche con giardini panoramici, ispirazione per Wagner (Parsifal)", "Tavole Amalfitane — antico codice di diritto marittimo medievale, tra i primi d'Europa", "Terrazzamenti dei limoni (sfusato amalfitano) — paesaggio agrario storico coltivato su pergolati verticali"], "daNonOmettere": ["Il ruolo storico di Amalfi come potenza marinara medievale, con le proprie Tavole Amalfitane come codice giuridico marittimo di riferimento nel Mediterraneo", "La distinzione tra i tre centri: Amalfi (storico centro marinaro), Positano (borgo verticale, icona fotografica), Ravello (ville aristocratiche panoramiche)", "Il criterio UNESCO del paesaggio culturale: interazione armoniosa tra natura (costa scoscesa) e insediamento umano (terrazzamenti, borghi verticali)", "La fortuna internazionale della costiera dal Grand Tour ottocentesco al turismo di massa contemporaneo"], "collegamenti": ["Storia delle repubbliche marinare italiane (Amalfi, Genova, Pisa, Venezia)", "Storia del diritto marittimo medievale (Tavole Amalfitane)", "Paesaggio agrario terrazzato mediterraneo (limoni, vigneti)", "Storia del turismo (Grand Tour, fortuna letteraria e artistica della costiera)"], "aneddoto": "Le Tavole Amalfitane, codificate probabilmente nell'XI secolo, regolarono per secoli il diritto marittimo in tutto il Mediterraneo, ben oltre i confini della piccola repubblica che le aveva scritte: un caso in cui una città di poche migliaia di abitanti riuscì a imporre le proprie regole commerciali a un intero mare."}, "Parco Archeologico di Cuma": {"inquadramento": "La più antica colonia greca d'Occidente, fondata da coloni calcidesi ed euboici nell'VIII secolo a.C. presso l'attuale Pozzuoli: sede della leggendaria Sibilla Cumana e crocevia tra il mondo greco, etrusco e italico nei Campi Flegrei.", "nomiChiave": ["Tempio di Apollo e Tempio di Giove — sulla acropoli, riadattati in epoca cristiana come basiliche", "Arco Felice — monumentale arco romano sulla via Domiziana"], "daNonOmettere": ["Il dibattito archeologico sull'identificazione certa dell'Antro della Sibilla, scavo che non tutti gli studiosi concordano corrisponda esattamente al mito virgiliano", "Il ruolo di Cuma come tramite culturale: trasmise l'alfabeto greco agli Etruschi, che a loro volta lo trasmisero ai Romani", "La trasformazione tardoantica dei templi greci in basiliche cristiane, segno della lunga continuità del sito"], "collegamenti": ["Letteratura latina (Eneide di Virgilio, libro VI, discesa agli Inferi)", "Storia dell'alfabeto e trasmissione culturale greco-etrusco-romana", "Religione e oracoli nel mondo antico (Sibilla, culto apollineo)", "Vulcanologia e Campi Flegrei (paesaggio infernale associato al mito)"], "aneddoto": "Secondo Virgilio, fu proprio nell'antro scavato nella roccia di Cuma che la Sibilla guidò Enea nella discesa al mondo dei morti: camminare oggi lungo quella galleria di tufo, lunga oltre cento metri e illuminata da feritoie laterali, resta una delle esperienze più suggestive dell'archeologia campana, mito e pietra che coincidono quasi alla lettera."}, "Grotte di Pertosa-Auletta": {"inquadramento": "Complesso carsico nel Vallo di Diano (Salerno), unico in Italia a essere visitabile in parte in barca lungo un fiume sotterraneo (il Negro): frequentato fin dall'età del Bronzo, come dimostrano i resti di un villaggio palafitticolo scoperto all'ingresso della grotta.", "nomiChiave": ["Fiume Negro — corso d'acqua sotterraneo che attraversa la grotta, navigabile in barca per il primo tratto della visita", "Villaggio palafitticolo dell'età del Bronzo — resti scoperti nell'ambiente d'ingresso, tra le testimonianze più antiche di frequentazione umana delle grotte italiane", "MIdA (Musei Integrati dell'Ambiente) — struttura museale e didattica annessa al complesso", "Sala del Paradiso e Sala delle Meraviglie — ambienti interni con concrezioni calcaree (stalattiti e stalagmiti)", "Pipistrelli — colonie di diverse specie chirotteriche che popolano le zone più profonde della grotta"], "daNonOmettere": ["L'unicità del percorso in barca sul fiume sotterraneo, elemento che distingue Pertosa-Auletta dalle altre grotte carsiche italiane", "Il valore archeologico del villaggio dell'età del Bronzo, che dimostra una frequentazione umana millenaria dell'ambiente ipogeo, non solo come rifugio occasionale", "La compresenza di interesse speleologico (concrezioni), archeologico (villaggio) e naturalistico (chirotterofauna)", "Il ruolo educativo del polo MIdA, che affianca alla visita un percorso didattico su ambiente e biodiversità"], "collegamenti": ["Preistoria dell'Italia meridionale (insediamenti palafitticoli in grotta, età del Bronzo)", "Speleologia e carsismo dell'Appennino campano", "Zoologia e conservazione (colonie di pipistrelli, biodiversità ipogea)", "Turismo esperienziale e didattica ambientale (MIdA)"], "aneddoto": "All'ingresso della grotta, dove oggi i visitatori salgono in barca per il primo tratto del percorso, gli archeologi hanno riportato alla luce i resti di un villaggio su palafitte dell'età del Bronzo: gli uomini preistorici non si limitavano a rifugiarsi occasionalmente in questa grotta, ma vi avevano costruito una vera e propria abitazione stabile, sospesa sull'acqua del fiume sotterraneo."}, "Reggia di Caserta": {"inquadramento": "Reggia settecentesca fatta costruire da Carlo di Borbone per rivaleggiare con Versailles, su progetto di Luigi Vanvitelli (prima pietra 1752, completata nel 1845 dai successori). Patrimonio UNESCO dal 1997 insieme al Parco, all'Acquedotto Carolino e al Complesso serico di San Leucio.", "nomiChiave": ["Luigi Vanvitelli — architetto, poi succeduto dal figlio Carlo Vanvitelli", "Carlo di Borbone — committente, re di Napoli", "Acquedotto Carolino (38 km, sorgenti del Fizzo, Ponti della Valle di Maddaloni)", "Complesso serico di San Leucio — colonia manifatturiera con statuto sociale d'ispirazione illuminista", "Giardino all'italiana e Giardino inglese (1786, con il botanico inglese John Andrew Graefer)", "Grande Cascata e fontane a tema mitologico (Diana e Atteone)"], "daNonOmettere": ["I quattro criteri UNESCO: creazione dello spirito illuminista (i), crocevia di valori umani/pianificazione urbana borbonica (ii), e il valore idealistico del complesso industriale di San Leucio", "La funzione dell'Acquedotto Carolino, non solo scenografica (le fontane) ma anche produttiva (mulini, ferriere, manifatture lungo il percorso)", "Il giardino inglese del 1786-90, tra i primi in Italia, con piante esotiche introdotte da Graefer (camelia dal Giappone)", "Il modello di riferimento dichiarato: Versailles e La Granja de San Ildefonso"], "collegamenti": ["Storia del Regno di Napoli e dei Borbone delle Due Sicilie nel Settecento", "Ingegneria idraulica (confronto con gli acquedotti romani, i Ponti della Valle come record di lunghezza in Europa all'epoca)", "Storia del lavoro e organizzazione sociale (San Leucio, statuto delle maestranze serike)", "Storia del giardino (giardino all'italiana vs giardino paesaggistico all'inglese)"], "aneddoto": "I Ponti della Valle di Maddaloni, alti quasi 56 metri su tre ordini di arcate, furono il ponte più lungo d'Europa al momento della costruzione: hanno retto senza danni tre violenti terremoti negli ultimi due secoli, prova della qualità dell'ingegneria vanvitelliana."}, "Parco Nazionale del Cilento e Vallo di Diano": {"inquadramento": "Sito UNESCO seriale (1998) che unisce il paesaggio culturale del Parco Nazionale del Cilento, i siti archeologici di Paestum e Velia e la Certosa di Padula: un'area di circa 159.000 ettari che fu per millenni corridoio di comunicazione tra Tirreno e mondo greco-lucano.", "nomiChiave": ["Paestum (Poseidonia) — colonia greca fondata fine VII sec. a.C.", "Velia (Elea) — colonia focese del 540 a.C. ca., sede della scuola eleatica", "Parmenide e Zenone di Elea — filosofi presocratici della scuola eleatica", "Certosa di San Lorenzo a Padula — fondata nel 1306 da Tommaso Sanseverino, oggi Museo Archeologico della Lucania Occidentale", "Porta Rosa a Velia — arco a tutto sesto tra i più antichi esempi greci", "Terme Adrianee di Velia (II sec. d.C.)"], "daNonOmettere": ["Distinguere le due città classiche (Paestum, tempi dorici; Velia, filosofia eleatica) dalla componente monastica barocca (Certosa di Padula)", "Il criterio UNESCO del paesaggio culturale: le creste montuose come vie di comunicazione preistoriche e poi medievali tra Adriatico e Tirreno", "L'abbandono di Velia bassa e la sopravvivenza dell'acropoli fino al Seicento", "La Certosa come il più vasto complesso monastico dell'Italia meridionale, spogliata dai certosini nel 1807 in epoca murattiana"], "collegamenti": ["Filosofia presocratica (scuola eleatica, essere e apparenza)", "Storia della Magna Grecia e colonizzazione greca (focesi, confine con Etruschi e Lucani)", "Architettura monastica certosina (confronto con la Certosa di San Martino a Napoli)", "Geografia dei parchi nazionali italiani e paesaggio mediterraneo"], "aneddoto": "A Velia si può ancora attraversare la Porta Rosa, uno dei più antichi archi a tutto sesto del mondo greco: un dettaglio tecnico che anticipa di secoli una soluzione costruttiva che i romani renderanno celebre in tutto l'impero."}, "Area archeologica di Marzabotto": {"inquadramento": "Città etrusca di Kainua (già nota come Misa), fondata nel VI-V secolo a.C. sul Pian di Misano presso Marzabotto (BO): l'unico insediamento etrusco che conserva intatto il proprio impianto urbanistico originario, mai sovrapposto da fondazioni successive. Abbandonata a metà del IV secolo a.C. con l'arrivo dei Celti, fu riscoperta a partire dal 1830 e oggi comprende parco archeologico e Museo Nazionale Etrusco \"Pompeo Aria\".", "nomiChiave": ["Kainua (\"la città nuova\") — nome originario rivelato da un'iscrizione su una coppa in bucchero", "Pompeo Aria — archeologo che avviò gli scavi sistematici dal 1862, dà il nome al museo", "Tempio di Tinia e tempio di Uni — le due principali divinità etrusche venerate sull'acropoli", "Rito di fondazione etrusco (decussis, cippo con incisione cardinale ritrovato 1963-65)", "Felsina (Bologna) e Spina — le altre due grandi città-stato dell'Etruria padana", "Guido Achille Mansuelli — soprintendente che ampliò gli scavi e il museo nel Novecento"], "daNonOmettere": ["L'unicità urbanistica: griglia ortogonale di cardo e decumani orientata secondo il rito etrusco di fondazione (templum celeste)", "Le tre fasi cronologiche: Marzabotto I (villaggio, 550-500 a.C.), Marzabotto II (città vera e propria, 500-350 a.C. ca.), abbandono con l'arrivo dei Celti", "Il ruolo commerciale di Kainua tra l'Etruria tirrenica, la Pianura Padana e il porto di Spina", "La tragica memoria del Novecento: l'eccidio nazifascista di Marzabotto (settembre-ottobre 1944) e la distruzione di parte dei reperti del museo nel bombardamento del 17 novembre 1944"], "collegamenti": ["Civiltà etrusca e urbanistica antica (confronto con le città coloniali greche a griglia ortogonale, es. Paestum)", "Religione e augurato etrusco (orientamento cosmico della città)", "Storia del Novecento e memoria delle stragi naziste in Italia"], "aneddoto": "Il nome vero della città è rimasto un mistero per oltre un secolo, creduta \"Misa\" dal toponimo locale: solo il ritrovamento di due ciotole rituali con l'iscrizione \"kainuaθi\" (\"io sono a Kainua\") ha restituito alla città il suo nome originale."}, "I Portici di Bologna": {"inquadramento": "Sito UNESCO seriale (iscritto il 28 luglio 2021) composto da 12 tratti di portici bolognesi, dal XII secolo a oggi, su un totale cittadino di circa 62 km (42 nel solo centro storico): il sistema porticato continuo più esteso al mondo, nato come ampliamento spontaneo e abusivo delle case medievali sul suolo pubblico.", "nomiChiave": ["Portico di San Luca — il più lungo del mondo, percorso devozionale verso il Santuario della Madonna di San Luca", "Portico del Pavaglione — 139 metri, 30 arcate, accanto al Palazzo dell'Archiginnasio (XVI sec.)", "Portico di Santa Maria dei Servi — esempio tardogotico in Strada Maggiore", "Arco del Meloncello", "Portico del quartiere Barca (\"Treno della Barca\") — esempio novecentesco in cemento armato", "Legge del 1041 — prima attestazione storica dei portici bolognesi"], "daNonOmettere": ["L'origine spontanea e inizialmente abusiva dei portici: sporti in legno delle case private che invadevano il suolo pubblico, poi regolamentati", "La varietà tipologica e cronologica premiata dal criterio UNESCO (iv): dal legno medievale alla pietra rinascimentale, fino al cemento del Novecento", "La doppia funzione, sociale (passeggio, riparo) e commerciale (spazio per botteghe artigiane)", "Il parere contrario dell'ICOMOS, superato dal voto del Comitato del Patrimonio Mondiale nel 2021"], "collegamenti": ["Storia urbanistica medievale (rapporto tra proprietà privata e spazio pubblico)", "Storia dell'architettura civile e religiosa a Bologna (Archiginnasio, basiliche cittadine)", "Devozione popolare (il pellegrinaggio a piedi coperto verso il Santuario di San Luca)"], "aneddoto": "Il portico di San Luca, quasi 4 km e 666 arcate fino alla collina della Guardia, nacque nel Settecento per permettere ai bolognesi di portare in processione l'icona della Madonna in città restando sempre al coperto, pioggia o sole: un'infrastruttura devozionale diventata poi percorso podistico e simbolo cittadino."}, "Parco Archeologico di Ercolano": {"inquadramento": "Città romana sepolta dall'eruzione del Vesuvio del 79 d.C. sotto una colata piroclastica che, a differenza delle ceneri di Pompei, ne ha conservato in modo eccezionale strutture in legno, tessuti e persino cibi carbonizzati. Patrimonio UNESCO dal 1997 insieme a Pompei e Torre Annunziata.", "nomiChiave": ["Casa a Graticcio — abitazione con struttura a graticcio ligneo eccezionalmente conservata", "Terme Suburbane — complesso termale con apparato decorativo intatto", "Fondaci sulla spiaggia antica — ambienti dove furono ritrovati centinaia di scheletri di fuggiaschi, sorpresi dal flusso piroclastico mentre cercavano di imbarcarsi", "Amedeo Maiuri — archeologo che diresse i principali scavi del Novecento a Ercolano e Pompei"], "daNonOmettere": ["La differenza di dinamica eruttiva rispetto a Pompei: Ercolano fu sepolta da flussi piroclastici (nubi ardenti) ad alta temperatura, non da pioggia di lapilli e cenere, il che spiega la carbonizzazione anziché la distruzione dei materiali organici", "La scoperta degli scheletri sulla spiaggia antica (anni Ottanta del Novecento), che ha rivelato per la prima volta con precisione la sorte tragica degli abitanti in fuga"], "collegamenti": ["Vulcanologia (dinamiche eruttive esplosive vs flussi piroclastici, confronto con Pompei)", "Storia della vita quotidiana romana (arredi, cibi, tessuti conservati)", "Storia della biblioteconomia antica (Villa dei Papiri, unico caso di biblioteca romana sopravvissuta)", "Storia dell'archeologia (Amedeo Maiuri, metodi di scavo del Novecento)"], "aneddoto": "Nei fondaci sulla antica spiaggia di Ercolano furono ritrovati, solo negli anni Ottanta del Novecento, gli scheletri di centinaia di abitanti raccolti in attesa di un soccorso via mare che non arrivò mai: per quasi duemila anni si era creduto che gli ercolanesi fossero riusciti a fuggire in tempo, finché quella scoperta non ha restituito la vera, drammatica sorte della città."}, "Parco Archeologico di Paestum": {"inquadramento": "Poseidonia, colonia greca fondata da coloni di Sibari alla fine del VII secolo a.C. sulla piana del Sele (Salerno), poi Paestum in età lucana e romana: conserva il complesso di templi dorici greci meglio preservato al mondo insieme alla Valle dei Templi di Agrigento.", "nomiChiave": ["Tempio di Nettuno (o di Hera II, V sec. a.C.) — il meglio conservato, tra i templi dorici più integri del mondo greco", "Basilica (Tempio di Hera I, metà VI sec. a.C.) — il più antico dei tre templi", "Tempio di Cerere (o di Atena, fine VI sec. a.C.)", "Tomba del Tuffatore — affresco funerario lucano-greco (480 a.C. ca.), unica raffigurazione greca di figura umana in immersione conosciuta", "Museo Archeologico Nazionale di Paestum — conserva le metope del santuario di Hera alla foce del Sele e la Tomba del Tuffatore"], "daNonOmettere": ["La distinzione tra i tre templi dorici (Basilica, Nettuno, Cerere), dedicati a divinità la cui identificazione moderna resta in parte convenzionale", "Il passaggio di dominazione: colonia greca (Poseidonia) → città lucana (Paistom, dal 400 a.C. ca.) → colonia latina romana (Paestum, 273 a.C.)", "L'unicità della Tomba del Tuffatore come unico esempio di pittura funeraria greca con figura umana in tale posa, probabile simbolo del passaggio dalla vita alla morte", "L'abbandono medievale del sito per la malaria e l'impaludamento, che ne ha paradossalmente preservato l'integrità fino alla riscoperta settecentesca"], "collegamenti": ["Architettura dorica greca (confronto con Agrigento, Selinunte)", "Storia della colonizzazione greca e lucana in Campania", "Pittura funeraria greca (Tomba del Tuffatore, iconografia simbolica)", "Riscoperta settecentesca dell'antichità (Grand Tour, influenza sul neoclassicismo)"], "aneddoto": "Il tuffatore dipinto sulla lastra di copertura di una tomba lucana-greca compie un gesto che nessun'altra pittura greca antica ha mai raffigurato: un corpo sospeso a mezz'aria, proteso verso l'acqua. Gli studiosi lo leggono come metafora del passaggio dalla vita alla morte — un'immagine così insolita da essere rimasta unica nel suo genere per tutta l'antichità classica."}, "Parco Archeologico di Pompei": {"inquadramento": "Città romana sepolta dall'eruzione del Vesuvio del 24-25 agosto 79 d.C. sotto metri di lapilli e cenere: la sua scoperta a partire dal 1748 ha restituito uno spaccato ineguagliato della vita quotidiana romana, dagli affreschi ai calchi dei corpi delle vittime. Patrimonio UNESCO dal 1997.", "nomiChiave": ["Plinio il Giovane — testimone oculare dell'eruzione, ne descrisse le fasi in due lettere a Tacito (unica fonte diretta sull'evento)", "Plinio il Vecchio — ammiraglio e naturalista, morto durante i soccorsi a Stabia", "Giuseppe Fiorelli — archeologo che introdusse dal 1863 la tecnica dei calchi in gesso dei vuoti lasciati dai corpi nella cenere", "Casa dei Vettii, Villa dei Misteri — dimore con cicli pittorici tra i più celebri dell'arte romana", "Foro, Anfiteatro, Terme Stabiane — principali edifici pubblici della città"], "daNonOmettere": ["La distinzione tra la dinamica eruttiva di Pompei (pioggia di lapilli e cenere, morte per crollo di tetti e asfissia) e quella di Ercolano (flussi piroclastici)", "L'innovazione tecnica di Fiorelli: colare gesso nelle cavità lasciate dai corpi decomposti nella cenere indurita, restituendo le pose esatte delle vittime al momento della morte"], "collegamenti": ["Vulcanologia storica (fonti di Plinio il Giovane, prima descrizione scientifica di un'eruzione)", "Storia della vita quotidiana romana (case, commerci, pitture, iscrizioni elettorali)", "Storia dell'archeologia moderna (metodo di Fiorelli, tecniche di scavo stratigrafico)", "Storia dei Borbone di Napoli (avvio degli scavi settecenteschi)"], "aneddoto": "I calchi in gesso introdotti da Giuseppe Fiorelli non riproducono i corpi delle vittime, ma il vuoto che questi hanno lasciato nella cenere indurita dopo essersi decomposti: versando gesso liquido in quelle cavità invisibili, Fiorelli restituì per la prima volta, quasi 1800 anni dopo, le pose esatte degli ultimi istanti di vita dei pompeiani."}, "Parco Nazionale del Vesuvio": {"inquadramento": "Area protetta (istituita nel 1995) attorno al vulcano attivo che nel 79 d.C. distrusse Pompei ed Ercolano: primo parco nazionale d'Italia dedicato a un vulcano, riserva della biosfera UNESCO dal 1997, con un ecosistema che si è ricostituito sulle colate laviche più recenti (ultima eruzione 1944).", "nomiChiave": ["Eruzione del 79 d.C. — descritta da Plinio il Giovane, distrusse Pompei, Ercolano e Stabia", "Eruzione del 1944 — ultima eruzione del vulcano, durante l'occupazione alleata della Seconda guerra mondiale", "Osservatorio Vesuviano (1841) — il più antico osservatorio vulcanologico permanente al mondo"], "daNonOmettere": ["Il rischio vulcanico attuale: il Vesuvio è considerato tra i vulcani più pericolosi al mondo per l'alta densità abitativa dell'area circostante", "Il ruolo pionieristico dell'Osservatorio Vesuviano, fondato nel 1841, primo istituto di monitoraggio vulcanico permanente al mondo", "La ricolonizzazione vegetale delle colate laviche recenti, esempio di resilienza ecologica in un ambiente fortemente perturbato"], "collegamenti": ["Vulcanologia e rischio sismico-vulcanico (area a più alta densità di popolazione a rischio vulcanico al mondo)", "Storia antica (eruzione del 79 d.C., Pompei ed Ercolano)", "Storia della scienza (Osservatorio Vesuviano, nascita della vulcanologia moderna)", "Ecologia della resilienza (ricolonizzazione delle colate laviche)"], "aneddoto": "L'ultima eruzione del Vesuvio, nel marzo 1944, avvenne mentre le truppe alleate erano di stanza nell'area dopo lo sbarco a Salerno: la cenere vulcanica danneggiò decine di bombardieri americani schierati su una vicina base aerea, rendendo quell'eruzione uno dei rari casi in cui un evento vulcanico ha interferito direttamente con le operazioni di una guerra mondiale."}, "Centro storico monumentale di Napoli: Duomo, Cappella Sansevero, Quartieri Spagnoli, Napoli sotterranea e Palazzo Reale": {"inquadramento": "Il centro storico di Napoli, Patrimonio UNESCO dal 1995, è il più esteso d'Europa: stratificazione ininterrotta di 2500 anni di storia, dalla polis greca di Neapolis alla capitale del Regno delle Due Sicilie, racchiusa in un reticolo urbano ancora leggibile nei decumani antichi.", "nomiChiave": ["Duomo di Napoli (San Gennaro) — custodisce le ampolle del sangue del santo patrono, oggetto del celebre 'miracolo' di liquefazione", "Cappella Sansevero — mausoleo della famiglia di Sangro, custodisce il Cristo velato di Giuseppe Sanmartino (1753)", "Quartieri Spagnoli — reticolo urbano cinquecentesco, edificato per alloggiare le guarnigioni spagnole", "Napoli sotterranea — rete di cavità, cisterne greco-romane e gallerie usate come rifugi antiaerei nel Novecento", "Palazzo Reale — residenza dei viceré spagnoli e poi dei Borbone, con le statue degli otto re di Napoli in facciata"], "daNonOmettere": ["Il criterio UNESCO: continuità urbanistica ininterrotta su un impianto greco-romano ancora riconoscibile nei decumani (via Spaccanapoli e i vicoli paralleli)", "Il mistero tecnico mai risolto del Cristo velato: il velo scolpito nel marmo sembra un tessuto reale posato sul corpo, tecnica che ha alimentato leggende di 'marmorizzazione' alchemica mai provate", "Il fenomeno di San Gennaro: la liquefazione del sangue, ripetuta tre volte l'anno, oggetto di osservazione scientifica ma mai di spiegazione univoca", "La distinzione tra Napoli sotterranea di origine greco-romana (cisterne, acquedotti) e i suoi riusi moderni (rifugi bellici)"], "collegamenti": ["Storia urbana millenaria (Neapolis greca, Napoli romana, medievale, angioina, aragonese, spagnola, borbonica)", "Scultura barocca e tecnica marmorea (Cristo velato, Sanmartino)", "Devozione popolare e antropologia religiosa (culto di San Gennaro)", "Ingegneria idraulica antica (cisterne e acquedotti di Napoli sotterranea)"], "aneddoto": "Nessuno scultore dopo Giuseppe Sanmartino è mai riuscito a spiegare con certezza come il velo del Cristo velato, scolpito in un unico blocco di marmo insieme al corpo sottostante, riesca a sembrare un tessuto reale posato sopra: un enigma tecnico che per due secoli e mezzo ha alimentato leggende su presunte formule di marmorizzazione segrete, mai confermate da alcuna fonte storica."}, "Monumenti Paleocristiani di Ravenna": {"inquadramento": "Sito UNESCO seriale (1996) composto da otto edifici religiosi eretti tra V e VI secolo, quando Ravenna fu capitale dell'Impero Romano d'Occidente (dal 402), poi capitale ostrogota e infine bizantina: il ciclo musivo meglio conservato al mondo per l'arte paleocristiana e bizantina.", "nomiChiave": ["Mausoleo di Galla Placidia — mosaici su fondo blu notte, tra i più antichi del gruppo", "Basilica di San Vitale — pianta ottagonale, mosaici di Giustiniano e Teodora (consacrata 548)", "Giuliano Argentario — banchiere che finanziò San Vitale, ritratto in mosaico accanto a Giustiniano"], "daNonOmettere": ["La cronologia politica sottesa ai monumenti: capitale dell'Impero d'Occidente, poi corte ostrogota di Teodorico, poi dominio bizantino di Giustiniano", "La distinzione tra Battistero Neoniano (ortodosso) e Battistero degli Ariani, riflesso del conflitto religioso ariano-niceno", "La pianta centrale ottagonale di San Vitale, ispirata a modelli costantinopolitani (Santi Sergio e Bacco)", "L'evoluzione stilistica leggibile nei mosaici: dal naturalismo tardoromano (Galla Placidia) alla stilizzazione bizantina (San Vitale)"], "collegamenti": ["Storia tardoantica e caduta dell'Impero Romano d'Occidente (Onorio, Galla Placidia)", "Storia bizantina (Giustiniano, Teodora, riconquista dell'Italia)", "Teologia e storia dei concili (questione ariana)", "Storia dell'arte musiva e tecnica del mosaico"], "aneddoto": "Il Mausoleo di Galla Placidia, secondo la tradizione fatto costruire dalla sorella dell'imperatore Onorio, non ha in realtà mai custodito il suo corpo: un edificio-reliquiario rimasto vuoto del suo scopo dichiarato, ma pieno di uno dei cicli musivi più antichi e ammirati al mondo."}, "Area Archeologica di Aquileia": {"inquadramento": "Colonia romana fondata nel 181 a.C. come avamposto contro le popolazioni transalpine, divenuta una delle città più ricche dell'Impero fino al sacco di Attila (452 d.C.). Patrimonio UNESCO dal 1998: gran parte della città resta non scavata sotto i campi, rendendola la più grande riserva archeologica del suo genere.", "nomiChiave": ["Foro romano e Basilica civile (II-III sec. d.C.)", "Porto fluviale sul Natissa — magazzini e banchine", "Basilica patriarcale — mosaico pavimentale del IV secolo (vescovo Teodoro), tra i più grandi d'Europa", "Patriarcato di Aquileia — sede religiosa e politica sopravvissuta fino al 1751", "Giovanni Battista Brusin — archeologo che avviò gli scavi sistematici del foro nel 1934", "Attila e gli Unni — distruzione della città nel 452 d.C."], "daNonOmettere": ["I due criteri UNESCO: città romana quasi intatta e non scavata (iv) e ruolo della Basilica nell'evangelizzazione dell'Europa centrale (vi)", "La distinzione tra area archeologica romana (foro, porto, domus) e Basilica patriarcale (aule paleocristiane del IV sec. + ricostruzione romanico-gotica XI-XIV sec.)", "Il ruolo di Aquileia come crocevia commerciale tra Mediterraneo ed Europa centrale, decima regio augustea (Venetia et Histria)", "La menzione di Aquileia nel De bello Gallico di Cesare, che vi pose gli accampamenti nell'inverno 58 a.C."], "collegamenti": ["Storia romana di frontiera (difesa dai popoli transalpini, invasioni di Attila)", "Storia del cristianesimo altomedievale e dei patriarcati (confronto con Venezia, erede del patriarcato)", "Arte musiva pavimentale (confronto con i mosaici bizantini di Ravenna)", "Geografia storica del Friuli (stemma regionale derivato da Aquileia romana)"], "aneddoto": "Il mosaico pavimentale della Basilica, riportato alla luce solo nei primi del Novecento sotto il pavimento medievale, racconta scene dell'Antico Testamento ed è tra i più estesi d'Europa: per secoli i fedeli hanno camminato sopra un capolovoro paleocristiano senza saperlo."}, "Castel Sant'Angelo": {"inquadramento": "Mausoleo fatto costruire dall'imperatore Adriano per sé e la sua famiglia (135-139 d.C.) sulla riva destra del Tevere, poi fortezza, prigione e residenza papale, oggi museo. Il nome attuale deriva da una visione dell'arcangelo Michele avuta da papa Gregorio Magno nel 590 durante una processione contro la peste.", "nomiChiave": ["Imperatore Adriano — committente del mausoleo, modellato sul Mausoleo di Augusto ma più grande", "Ponte Elio (oggi Ponte Sant'Angelo) — accesso originario dal Campo Marzio, con gli angeli del Bernini (1667-69)", "Passetto di Borgo — corridoio fortificato fatto costruire da Niccolò III Orsini, collega il Vaticano al Castello", "Papa Clemente VII — vi si rifugiò durante il Sacco di Roma (1527)", "Sala delle Urne — camera sepolcrale originaria con le ceneri di Adriano, Sabina, e degli imperatori Antonini fino a Caracalla", "Giordano Bruno — tra i prigionieri illustri del Castello"], "daNonOmettere": ["La trasformazione funzionale in tre grandi fasi: mausoleo imperiale, bastione delle Mura Aureliane (403 d.C., Onorio), fortezza-residenza papale", "L'episodio del 1527: fuga di Clemente VII attraverso il Passetto durante il Sacco di Roma dei Lanzichenecchi di Carlo V", "La leggenda dell'apparizione dell'arcangelo Michele (590 d.C.) che dà il nome al castello", "L'uso come carcere pontificio (Giordano Bruno, Cellini) fino all'Ottocento"], "collegamenti": ["Architettura funeraria romana (confronto con il Mausoleo di Augusto)", "Storia del papato e rapporti Chiesa-Impero (Sacco di Roma 1527)", "Storia dell'arte barocca (ponte Sant'Angelo, angeli di Bernini)", "Storia delle mura di Roma (Mura Aureliane, sistema difensivo tardoantico)"], "aneddoto": "Durante l'assedio dei Goti del 537 d.C., i difensori romani, a corto di proiettili, scagliarono sugli assalitori le stesse statue antiche che decoravano il mausoleo — trasformando in armi da difesa le sculture che Adriano aveva voluto per onorare i suoi morti."}, "Domus Aurea": {"inquadramento": "Reggia fatta costruire da Nerone dopo l'incendio di Roma del 64 d.C., estesa sul colle Oppio e oltre: un complesso sperimentale per tecnica costruttiva e decorazione, abbandonato e interrato dai successori. Riscoperta per caso alla fine del Quattrocento, la sua decorazione pittorica ha dato origine allo stile rinascimentale delle \"grottesche\".", "nomiChiave": ["Nerone — committente, dopo l'incendio di Roma del 64 d.C.", "Sala Ottagona — ambiente a pianta centrale, capolavoro dell'ingegneria degli spazi neroniana", "Raffaello Sanzio — primo artista rinascimentale a comprendere organicamente il sistema decorativo della Domus, riutilizzato nelle Logge Vaticane", "Pinturicchio, Filippino Lippi, Signorelli — tra i primi pittori a calarsi nelle \"grotte\" attorno al 1480", "Gruppo del Laocoonte — scoperto nel 1506 in un ambiente della Domus Aurea", "Grottesche — stile decorativo rinascimentale che prende nome dalle \"grotte\" della Domus"], "daNonOmettere": ["La distinzione tra la Domus Aurea neroniana e i successivi interventi che la seppellirono (Terme di Traiano costruite sopra le rovine)", "Il percorso storico della riscoperta: fine Quattrocento, artisti calati con torce nelle \"grotte\" sotterranee", "L'influenza diretta sull'arte del Cinquecento attraverso Raffaello e la diffusione delle grottesche dopo il Sacco di Roma del 1527", "Il contrasto tra la damnatio memoriae di Nerone e la fortuna artistica postuma del suo palazzo"], "collegamenti": ["Storia romana imperiale (Nerone, incendio di Roma, propaganda e memoria)", "Storia dell'arte rinascimentale (grottesche, Raffaello, Logge Vaticane e Villa Madama)", "Storia dell'archeologia (scoperta del Laocoonte, 1506, oggi ai Musei Vaticani)", "Tecnica costruttiva romana (volte, spazi centrali, sperimentazione architettonica neroniana)"], "aneddoto": "Gli artisti del Quattrocento che si calavano con le torce in quelle che credevano \"grotte\" non sapevano di trovarsi dentro la reggia di Nerone: scambiarono per caverne naturali gli ambienti sepolti di un palazzo imperiale, e dal loro equivoco nacque il nome stesso delle grottesche."}, "Villa Adriana": {"inquadramento": "Residenza imperiale extraurbana fatta costruire dall'imperatore Adriano presso Tivoli (118-134 d.C. ca.), su un'area di circa 120 ettari: un catalogo architettonico dei luoghi e delle culture visti dall'imperatore nei suoi viaggi (Grecia, Egitto). Patrimonio UNESCO dal 1999, ha influenzato architetti dal Rinascimento al Barocco fino al Novecento.", "nomiChiave": ["Canopo — bacino d'acqua che evoca il canale tra Alessandria d'Egitto e Canopo, con Serapeo", "Teatro Marittimo — isola circolare su canale, rifugio privato e introverso dell'imperatore", "Pecile (Poikile) — piazza porticata ispirata alla Stoà Poikile dell'agorà di Atene", "Piazza d'Oro, Grandi e Piccole Terme, Biblioteca greca e latina", "Rodolfo Lanciani — archeologo che condusse i principali scavi di liberazione dopo l'Unità d'Italia"], "daNonOmettere": ["La villa come 'catalogo' colto dei viaggi di Adriano, non semplice copia ma rielaborazione originale (Historia Augusta)", "L'uso sperimentale dell'opus caementicium per volte e forme non convenzionali", "Il ciclo di abbandono-spoliazione (marmi usati come materiale da costruzione) e riscoperta rinascimentale (Pirro Ligorio, poi Piranesi)", "I due criteri UNESCO: capolavoro sintetico delle culture del Mediterraneo antico (i) e influenza sull'architettura rinascimentale e barocca (ii)"], "collegamenti": ["Architettura imperiale romana e sperimentazione tecnica (confronto col Pantheon, altra opera legata ad Adriano)", "Storia dei viaggi di Adriano nell'impero (Grecia, Egitto, Vallo di Adriano in Britannia)", "Fortuna rinascimentale e barocca dell'antico (Ligorio, Piranesi, influenza su Villa d'Este)", "Ingegneria idraulica romana (terme, ninfei, giochi d'acqua)"], "aneddoto": "Il Teatro Marittimo non è un teatro: è una piccola villa su un'isola artificiale, raggiungibile solo con ponti levatoi che l'imperatore poteva ritirare a piacimento — un rifugio progettato per isolarsi letteralmente dal potere che esercitava."}, "Villa d'Este": {"inquadramento": "Villa e giardino rinascimentale a Tivoli, fatti realizzare a partire dal 1560 dal cardinale Ippolito II d'Este su progetto di Pirro Ligorio, su un antico convento benedettino. Patrimonio UNESCO dal 2001: uno dei primi e più influenti \"giardini delle meraviglie\" d'Europa, capolavoro di ingegneria idraulica rinascimentale.", "nomiChiave": ["Pirro Ligorio — architetto e archeologo, progettista del complesso", "Fontana dell'Ovato — detta \"Regina delle fontane\", alimentata dall'acqua dell'Aniene", "Fontana del Bicchierone — disegno di Gian Lorenzo Bernini (1660-61)", "Fontana dell'Organo — organo idraulico, tra i primi automi ad acqua d'Italia"], "daNonOmettere": ["Il sistema idraulico interamente a gravità, alimentato dal fiume Aniene, senza pompe meccaniche", "I cinque assi trasversali del giardino, ciascuno terminante in una fontana, per mascherare l'irregolarità della pianta", "I quattro criteri UNESCO: apogeo della cultura rinascimentale, influenza sui giardini europei, illustrazione dei principi estetici rinascimentali, prototipo del giardino delle meraviglie"], "collegamenti": ["Storia delle famiglie signorili italiane (Este, rapporti con il papato)", "Storia del giardino all'italiana e sua influenza sui giardini d'Europa (confronto con Versailles)", "Ingegneria idraulica rinascimentale (automi ad acqua, giochi di sorpresa per i visitatori)", "Scultura barocca (intervento di Bernini nella Fontana del Bicchierone)"], "aneddoto": "La Fontana dell'Organo produceva musica azionata soltanto dalla pressione dell'acqua, senza alcun meccanismo a orologeria: un prodigio che stupiva le corti europee del Cinquecento e che oggi torna a suonare grazie a un restauro moderno del suo meccanismo idraulico."}, "Villa dei Quintili e Santa Maria Nova": {"inquadramento": "Il più grande complesso residenziale del suburbio di Roma, al V miglio della via Appia Antica: costruito dai fratelli Sesto Quintilio Condiano e Sesto Quintilio Valerio Massimo (consoli nel 151 d.C.), fu confiscato dall'imperatore Commodo dopo averli fatti giustiziare (182-183 d.C.) e divenne residenza imperiale. Fa parte del Parco Archeologico dell'Appia Antica insieme al vicino sito di Santa Maria Nova.", "nomiChiave": ["Sesto Quintilio Condiano e Sesto Quintilio Valerio Massimo — fratelli consoli, proprietari originari (identificati da fistulae aquariae in piombo)", "Commodo — imperatore che li fece uccidere per presunta congiura e confiscò la villa", "Ninfeo monumentale — ingresso scenografico sulla via Appia Antica, poi trasformato in fortezza medievale", "Acquedotto dei Quintili (diramazione dell'Anio Novus)", "Antiquarium — statue di Zeus, Apollo citaredo e Artemide rinvenute negli anni Venti del Novecento", "Santa Maria Nova — casale con torre medievale su cisterna romana, aperto al pubblico dal 2013"], "daNonOmettere": ["La duplice fase costruttiva: nucleo originario dei Quintili (opera laterizia) e ampliamento imperiale dopo la confisca (opera listata)", "Il motivo della confisca: l'invidia di Commodo per la ricchezza e il prestigio dei due fratelli, accusati di una congiura mai provata con certezza", "L'area detta 'Roma Vecchia' dal Settecento, scambiata per i resti di una città per la sua vastità", "Le recenti scoperte (mosaici gladiatori, circo, cantina vinicola) che continuano ad ampliare la conoscenza del sito"], "collegamenti": ["Storia della via Appia Antica ('regina viarum') e delle ville suburbane romane", "Storia della dinastia degli Antonini e dei Severi (rapporti tra senato e potere imperiale sotto Commodo)", "Archeologia e storia del collezionismo (proprietà Torlonia dal 1797, passaggio allo Stato nel 1985-86)", "Ingegneria idraulica romana (acquedotti, cisterne, fistulae aquariae come fonte epigrafica)"], "aneddoto": "I nomi dei veri proprietari sono stati scoperti non da un'iscrizione onoraria, ma da tubature di piombo per l'acqua che ne recavano impresso il nome: un dettaglio idraulico, quasi burocratico, che ha restituito l'identità ai due fratelli che Commodo aveva cercato di cancellare insieme alla loro vita."}, "Strade Nuove e Palazzi dei Rolli": {"inquadramento": "Sistema urbanistico del centro storico di Genova, tra fine Cinquecento e inizio Seicento, quando la Repubblica di Genova era all'apice del potere finanziario e marittimo. Patrimonio UNESCO dal 2006: primo esempio in Europa di sviluppo urbano pianificato da un'autorità pubblica, legato al sistema dei \"Rolli\" (1576) per l'alloggio di ospiti di Stato in residenze private.", "nomiChiave": ["Galeazzo Alessi — architetto a cui si attribuisce il disegno delle Strade Nuove", "Rolli del 1576, 1588, 1599, 1614, 1644 — le cinque liste ufficiali dei palazzi", "Palazzo Doria Tursi, Palazzo Durazzo Pallavicini — tra i principali palazzi", "Pieter Paul Rubens — pubblicò la raccolta \"Palazzi di Genova\" come modello per l'aristocrazia europea", "42 palazzi (su 163 iscritti nei Rolli) inseriti nel sito UNESCO"], "daNonOmettere": ["Il sistema dei Rolli: un decreto del Senato genovese (1576) obbligava le famiglie più eminenti a ospitare a rotazione sovrani, ambasciatori e alti prelati in visita di Stato", "L'adattamento architettonico allo spazio stretto tra mare e colline: sviluppo verticale, cortili d'onore, scalinate monumentali", "I due criteri UNESCO: influenza sullo sviluppo dell'architettura manierista e barocca europea (ii) ed esempio eccezionale di pianificazione urbana aristocratica (iv)", "La distinzione tra i 163 palazzi iscritti storicamente nei Rolli e i soli 42 riconosciuti nel sito UNESCO"], "collegamenti": ["Storia delle repubbliche marinare italiane (potere finanziario e marittimo di Genova)", "Storia dell'architettura manierista e barocca europea (influenza tramite i disegni di Rubens)", "Storia della diplomazia d'età moderna (ospitalità di Stato come sistema pubblico-privato)", "Urbanistica e pianificazione pubblica in età moderna (primo esempio europeo)"], "aneddoto": "Le famiglie nobili genovesi non sceglievano quando ospitare un sovrano o un ambasciatore in visita: venivano estratte a sorte da un registro pubblico, i Rolli — un sistema che trasformava l'onore dell'ospitalità di Stato in un obbligo amministrativo a rotazione."}, "Grotte di Catullo": {"inquadramento": "La più imponente villa romana dell'Italia settentrionale, costruita tra la fine del I sec. a.C. e il I sec. d.C. sulla punta della penisola di Sirmione, sul Lago di Garda. Il nome, nato nel Quattrocento, deriva dall'aspetto di grotte naturali che le rovine invase dalla vegetazione offrivano ai primi visitatori, e dall'errata tradizione che la associava al poeta Catullo.", "nomiChiave": ["Gaio Valerio Catullo (84-54 a.C. ca.) — poeta veronese che nei suoi versi celebrò Sirmione, ma morto prima della costruzione della villa", "Gens Valeria — famiglia aristocratica veronese a cui si ipotizza appartenesse la villa", "Grande Criptoportico — passeggiata coperta ricavata scavando il banco roccioso", "Marin Sanudo il Giovane — nel 1483 primo ad attribuire (erroneamente) la villa a Catullo", "Uliveto storico — oltre 1500 piante secolari che circondano l'area archeologica"], "daNonOmettere": ["La discrepanza cronologica che smentisce l'attribuzione a Catullo: la villa fu costruita dopo la sua morte", "L'origine del nome 'Grotte': l'aspetto di caverne naturali che le rovine interrate offrivano ai visitatori rinascimentali", "La struttura architettonica: pianta rettangolare 167x105 m su più livelli, adattata al banco roccioso della penisola", "Il percorso di riconoscimento scientifico: primi scavi ottocenteschi, acquisizione pubblica 1947-49, prima guida corretta del 1956"], "collegamenti": ["Poesia latina (Catullo, la fortuna letteraria del luogo pur senza legame diretto)", "Storia dell'archeologia e della sua metodologia (dall'erudizione rinascimentale allo scavo scientifico)", "Architettura residenziale romana di lusso (ville d'otium sul lago, confronto con altre ville gardesane come Desenzano)", "Paesaggio agrario (l'uliveto storico come parte integrante del sito)"], "aneddoto": "Per secoli i visitatori credettero di camminare nella casa del poeta Catullo, ispirati dai suoi versi su Sirmione: solo l'archeologia moderna ha dimostrato che la villa fu costruita dopo la sua morte, lasciando il suo nome legato per sempre a una casa che non fu mai la sua."}, "Parco Archeologico di Urbisaglia": {"inquadramento": "Il più esteso parco archeologico delle Marche (circa 40 ettari), sui resti della colonia romana di Urbs Salvia (già Pollentia), monumentalizzata a partire dall'età augustea. L'abbandono improvviso in età tardoantica, con il trasferimento della popolazione sul vicino colle, ha conservato la città in condizioni rare per completezza.", "nomiChiave": ["Lucio Flavio Silva Nonio Basso — console nell'81 d.C., fece costruire l'anfiteatro a proprie spese", "Assedio di Masada (73-74 d.C.) — Silva vi comandò le legioni romane come luogotenente di Tito, prima di finanziare l'anfiteatro in patria", "Anfiteatro romano — capienza 5.150 spettatori, tra i meglio conservati delle Marche", "Tempio-criptoportico dedicato alla Salus Augusta", "Teatro romano — costruito da Gaio Fufio Gemino prima del 23 d.C., con tracce di intonaco dipinto", "Serbatoio dell'acquedotto — due gallerie parallele in cocciopesto idraulico, capacità 1000 mc"], "daNonOmettere": ["Il collegamento biografico tra il finanziatore dell'anfiteatro e l'assedio di Masada, evento cardine della prima guerra giudaica", "La cronologia della crisi: danni sismici e progressiva decadenza dal IV secolo, aggravati dal passaggio dei Visigoti di Alarico (408-409)", "La distinzione tra la città romana in pianura (Urbs Salvia) e il borgo medievale sorto sul Colle di San Biagio dopo l'abbandono", "Il criptoportico con pitture del III stile pompeiano, tra le testimonianze pittoriche meglio conservate delle Marche romane"], "collegamenti": ["Storia romana di età flavia (evergetismo di notabili locali arricchiti al servizio degli imperatori)", "Storia giudaico-romana (assedio di Masada, prima guerra giudaica)", "Ingegneria idraulica romana (acquedotto, serbatoio, cocciopesto)", "Pittura parietale romana (III stile pompeiano nel criptoportico)"], "aneddoto": "L'uomo che finanziò di tasca propria l'anfiteatro di Urbs Salvia, inaugurato con un combattimento tra 40 coppie di gladiatori, era lo stesso Lucio Flavio Silva che pochi anni prima aveva guidato le legioni romane nell'assedio di Masada: un generale della guerra giudaica diventato benefattore della sua città natale."}, "Parco Archeologico di Sepino": {"inquadramento": "Città romana di Saepinum, in località Altilia (Molise), costruita dopo la conquista romana del precedente centro sannitico di Terravecchia (293 a.C., terza guerra sannitica). Sorta all'incrocio tra il tratturo Pescasseroli-Candela e un percorso proveniente dal Matese, resta uno dei siti meglio conservati dell'Italia meridionale per l'impianto urbano completo.", "nomiChiave": ["Tratturo Pescasseroli-Candela — via della transumanza che attraversa il sito", "Porta Bojano, Porta Terravecchia, Porta Tammaro, Porta Benevento — le quattro porte monumentali", "Teatro romano — capienza fino a 3.000 spettatori, oggi sede del Museo della Città e del Territorio", "Mausoleo di Publius Numisius e Mausoleo di Caius Ennius Marsus — monumenti funerari extraurbani", "Saipins — il centro fortificato sannitico precedente, sulla montagna di Terravecchia", "Cardo e decumano non ortogonali — impostazione dovuta al preesistente incrocio dei tratturi"], "daNonOmettere": ["Il legame strutturale tra la città e l'economia della transumanza, ancora leggibile nell'orientamento non ortogonale degli assi stradali", "La sopravvivenza di abitazioni contadine settecentesche-ottocentesche sovrapposte alla cavea del teatro romano"], "collegamenti": ["Storia sannitica e guerre sannitiche (conquista romana dell'Italia centro-meridionale)", "Economia pastorale e transumanza appenninica (i tratturi come infrastruttura storica)", "Urbanistica romana (cardo e decumano, porte monumentali come archi di trionfo)", "Storia dell'insediamento rurale post-antico (case contadine nel teatro, continuità d'uso del sito)"], "aneddoto": "Il cardo e il decumano di Saepinum non si incrociano ad angolo perfettamente retto come nella norma urbanistica romana: i fondatori dovettero adattare la griglia cittadina ai due antichi tratturi della transumanza che si intersecavano già lì da secoli, piegando lo schema imperiale alle esigenze delle greggi."}, "Mole Antonelliana": {"inquadramento": "Edificio simbolo di Torino, progettato nel 1863 dall'architetto Alessandro Antonelli come sinagoga per la comunità ebraica torinese, poi acquistato dal Comune e completato nel 1889 come monumento all'unità nazionale. Con 167,5 metri fu l'edificio in muratura più alto d'Europa; dal 2000 ospita il Museo Nazionale del Cinema.", "nomiChiave": ["Comunità ebraica di Torino — committente originaria (1861), poi si ritirò per i costi crescenti", "Museo Nazionale del Cinema — dal 2000, allestimento di François Confino", "Friedrich Nietzsche — ammiratore dell'edificio durante il suo soggiorno torinese"], "daNonOmettere": ["Il cambio di funzione e di committenza: da sinagoga (progetto originario, 47 metri) a monumento civico (167,5 metri) dopo il ritiro della comunità ebraica nel 1877", "Il crollo della guglia nel 1953 per un nubifragio e la ricostruzione con struttura in cemento armato anziché muratura", "L'uso pregresso come sede del Museo del Risorgimento (1908-1938) prima della destinazione cinematografica", "Il primato tecnico: edificio in muratura non armata più alto del mondo dell'epoca, senza scheletro metallico originario"], "collegamenti": ["Storia dell'emancipazione ebraica in Italia (piena cittadinanza dal 1848, Statuto Albertino)", "Storia dell'Unità d'Italia e Torino capitale (1861-1864)", "Ingegneria e tecnica costruttiva ottocentesca (limiti e ambizioni della muratura non armata)", "Storia del cinema (Museo Nazionale del Cinema, uno dei più importanti al mondo)"], "aneddoto": "Il progetto iniziale prevedeva una sinagoga alta appena 47 metri: Antonelli, ossessionato dal superamento dei limiti costruttivi della muratura, la fece lievitare fino a 167,5 metri, esasperando la comunità ebraica committente al punto da farle abbandonare l'opera al Comune."}, "Castello di Racconigi": {"inquadramento": "Dimora dei Savoia-Carignano presso Cuneo, da fortificazione medievale trasformata in villa di delizie dal 1676 (Guarino Guarini), poi residenza estiva prediletta di Carlo Alberto di Savoia nell'Ottocento. Patrimonio UNESCO dal 1997 come parte del sito seriale delle Residenze Sabaude.", "nomiChiave": ["Guarino Guarini — trasformò dal 1676 la fortezza medievale in residenza di delizie per il principe Emanuele Filiberto", "Giovanni Battista Borra — completò a metà Settecento la facciata neoclassica e le Sale di Ercole e Diana", "Pelagio Palagi — regista della ridecorazione ottocentesca voluta da Carlo Alberto (Gabinetto Etrusco, Sala dei Dignitari)", "André Le Nôtre — architetto dei giardini di Versailles, ideatore del primo assetto geometrico del parco", "Xavier Kurten — paesaggista che completò il parco in stile romantico all'inglese (1820)", "Umberto II — ultimo re d'Italia, nato a Racconigi nel 1904; vendette il castello allo Stato nel 1980"], "daNonOmettere": ["Le fasi di trasformazione architettonica: casaforte medievale, villa barocca guariniana, facciata neoclassica di Borra, ridecorazione eclettica ottocentesca di Palagi", "L'evoluzione del parco da giardino geometrico alla francese (Le Nôtre) a giardino romantico all'inglese (Kurten, Pregliasco)", "Il Trattato di Racconigi (1909), firmato durante la visita dello zar Nicola II", "La nascita di Umberto II a Racconigi (1904) e la cessione del castello allo Stato nel 1980, dopo l'esilio della famiglia reale"], "collegamenti": ["Storia della dinastia sabauda e del Regno di Sardegna/Italia (Carlo Alberto, Vittorio Emanuele III, Umberto II)", "Storia del giardino (confronto tra modello geometrico francese e paesaggistico inglese)", "Diplomazia internazionale d'inizio Novecento (Trattato di Racconigi con la Russia)", "Riscoperta dell'antico e gusto eclettico ottocentesco (Gabinetto Etrusco ispirato a Pompei ed Ercolano)"], "aneddoto": "Nel parco della Margaria, costruita da Pelagio Palagi come azienda agricola moderna travestita da castello neogotico, i re di Savoia univano lo svago all'innovazione: un romitaggio romantico che era, allo stesso tempo, una fattoria all'avanguardia per l'Ottocento."}, "Castel del Monte": {"inquadramento": "Castello fatto costruire da Federico II di Svevia (1240 ca.) sulle Murge presso Andria, capolavoro di architettura medievale per la pianta ottagonale e il rigore matematico-astronomico delle sue forme. Patrimonio UNESCO dal 1996 per la fusione di elementi culturali del Nord Europa, del mondo islamico e dell'antichità classica.", "nomiChiave": ["Federico II di Svevia — imperatore del Sacro Romano Impero e re di Sicilia, committente, detto Stupor Mundi", "Pianta ottagonale — corte interna, otto sale per piano, otto torri ottagonali sugli spigoli", "Lettera di Gubbio (29 gennaio 1240) — prima testimonianza scritta relativa alla costruzione", "Breccia corallina, pietra calcarea, marmi — materiali del contrasto cromatico della struttura", "Rete castellare federiciana — collegamento strategico tra Andria e Garagnone presso Gravina", "Corteo dei cavalieri — frammento scultoreo superstite della decorazione originaria"], "daNonOmettere": ["Il dibattito sulla funzione dell'edificio: castrum difensivo, residenza di rappresentanza, o entrambe (assenza di fossato tipico)", "La ricorrenza simbolica del numero otto in ogni elemento decorativo (capitelli, chiavi di volta, cornici)", "L'assenza di conferma storica per le molte teorie esoteriche (Graal, Cupola della Roccia): distinguere fatti documentati da suggestioni divulgative", "Il criterio UNESCO: sintesi armonica di elementi nordeuropei, islamici e classici, riflesso della corte cosmopolita di Federico II"], "collegamenti": ["Storia del Sacro Romano Impero e della dinastia sveva (Federico II, corte multiculturale di Palermo)", "Simbolismo medievale dei numeri (l'otto come mediazione tra quadrato/terra e cerchio/cielo)", "Architettura militare e residenziale del Duecento (confronto con altri castelli federiciani di Puglia)", "Storia della scienza medievale (interessi matematici e astronomici di Federico II)"], "aneddoto": "Le scale a chiocciola del castello girano in senso antiorario, contrariamente alla regola difensiva del tempo (che avrebbe favorito i difensori armati di spada nella mano destra): un dettaglio che rafforza l'ipotesi che Castel del Monte non fosse pensato per la guerra, ma per qualcos'altro — rappresentanza, studio, forse simbolo di potere."}, "Trulli di Alberobello": {"inquadramento": "Abitazioni tradizionali in pietra a secco con tetto conico, concentrate nei rioni Monti e Aia Piccola di Alberobello (oltre 1500 strutture). Patrimonio UNESCO dal 1996 come esempio eccezionale di edilizia a secco preistorica ancora praticata, con un'origine legata anche a un espediente fiscale feudale.", "nomiChiave": ["Conti di Conversano (D'Acquaviva d'Aragona) — feudatari che imposero la costruzione a secco per aggirare la tassazione", "Pragmatica de Baronibus — editto del Regno di Napoli che tassava i nuovi insediamenti urbani stabili", "Chianche e chiancarelle — le lastre calcaree del doppio strato del tetto conico", "Rione Monti (1.030 trulli) e Rione Aia Piccola (590 trulli)", "Alberobello città regia (1797) — fine del vincolo feudale e legittimazione delle costruzioni"], "daNonOmettere": ["L'origine fiscale della tecnica a secco: costruzioni smontabili senza malta per eludere la tassa sui nuovi insediamenti", "La tecnica costruttiva: doppio muro a secco con nucleo di macerie, tetto autoportante a cerchi concentrici senza centine", "I simboli dipinti in calce sui pinnacoli (croci, soli, segni zodiacali) con funzione apotropaica o religiosa", "La tutela storica: monumento nazionale dal 1910 (legge Rosadi), poi iscrizione UNESCO nel 1996"], "collegamenti": ["Storia feudale del Regno di Napoli (fiscalità, rapporto tra baroni e comunità contadine)", "Tecniche costruttive a secco nel Mediterraneo (confronto con nuraghi sardi, tholos micenei, nuraghi e nuraghe)", "Architettura vernacolare e sostenibilità (isolamento termico naturale, materiali locali)", "Storia del turismo e della tutela del patrimonio (Cassa del Mezzogiorno, impatti su comunità e uso abitativo)"], "aneddoto": "I trulli nacquero da un espediente contro il fisco: costruendo senza malta, i contadini rendevano le case tecnicamente 'temporanee' e smontabili in caso di controllo, sfuggendo così alla tassa che il Regno di Napoli imponeva sui nuovi insediamenti stabili."}, "Su Nuraxi di Barumini": {"inquadramento": "Il più imponente e famoso complesso nuragico di Sardegna, ai piedi della Giara di Gesturi: una torre centrale del XVII-XIII sec. a.C. circondata da un bastione a quattro torri e un villaggio di capanne, abitato per circa 1500 anni fino all'epoca romana. Unico sito UNESCO della Sardegna (1997).", "nomiChiave": ["Giovanni Lilliu — archeologo sardo, scavò sistematicamente il sito tra il 1950 e il 1957", "Torre centrale (18,6 m) — nucleo più antico, tre camere sovrapposte a tholos", "Bastione quadrilobato — quattro torri angolari aggiunte nell'età del Bronzo finale", "Cinta muraria eptalobata — aggiunta nell'età del Ferro", "Casa Zapata — dimora nobiliare cinquecentesca sotto cui è stato scoperto un altro nuraghe (Su Nuraxi 'e Cresia)", "Civiltà nuragica (1800-238 a.C. ca.) — cultura preistorica sarda, fine con la conquista romana"], "daNonOmettere": ["Le fasi costruttive: torre centrale (Bronzo Medio), bastione a quattro torri (Bronzo Recente), cinta muraria e villaggio (età del Ferro)", "La datazione al radiocarbonio ottenuta da una trave lignea trovata nella torre centrale, cruciale per fissare la cronologia nuragica", "La funzione ancora dibattuta del nuraghe: fortezza, residenza di prestigio, o entrambe", "La continuità di occupazione fino al I secolo a.C./III d.C., con fasi puniche e poi romane senza rotture traumatiche"], "collegamenti": ["Preistoria e protostoria del Mediterraneo occidentale (civiltà nuragica, confronto con tholos micenei)", "Storia dell'archeologia italiana (Giovanni Lilliu, 'padre dell'archeologia sarda')", "Colonizzazione fenicio-punica e romana della Sardegna", "Tecnica costruttiva a secco (pseudocupola, blocchi poligonali senza malta)"], "aneddoto": "Prima dello scavo di Lilliu, la collina che nascondeva Su Nuraxi era semplicemente un campo arato dai contadini di Barumini per orzo e fave: sotto quella terra apparentemente ordinaria si celava, intatto, uno dei monumenti più importanti della preistoria europea."}, "Il Museo della Statuaria Preistorica (Menhir)": {"inquadramento": "Museo ospitato nell'ottocentesco Palazzo Aymerich di Laconi (Sardegna centrale), dedicato alla statuaria preistorica antropomorfa del III millennio a.C.: la maggiore collezione di menhir e statue-menhir sarde, scoperte a partire dal 1969 nel territorio del Sarcidano.", "nomiChiave": ["Enrico Atzeni — archeologo che scoprì nel 1969 la prima statua-menhir sarda (Genna Arrele I)", "Perdas fittas — nome sardo dei menhir (\"pietre conficcate\")", "Palazzo Aymerich — dimora neoclassica ottocentesca dei marchesi di Laconi, progettata da Gaetano Cima", "Cultura di Abealzu-Filigosa e cultura del Vaso Campaniforme — orizzonti culturali di riferimento (2700-1800 a.C. ca.)", "Genna Arrele, Perda Iddocca, Masone Perdu — i principali siti di ritrovamento nel territorio di Laconi", "Menhir protoantropomorfi, antropomorfi assessuati, statue-menhir — le tre tipologie evolutive classificate"], "daNonOmettere": ["La distinzione tipologica: dalla pietra grezza aniconica alla statua-menhir con dettagli sessuati (pugnale doppio per i maschili, seni per le femminili)", "Il riuso dei menhir in epoca nuragica come materiale da costruzione in nuraghi e tombe dei giganti (es. Nuraghe Orrubiu)", "La collocazione museale in un palazzo signorile ottocentesco, esso stesso bene culturale (progetto di Gaetano Cima)", "Il valore del sito come testimonianza della tradizione megalitica europea, non isolata ma in dialogo con altre aree del Mediterraneo"], "collegamenti": ["Preistoria e megalitismo europeo (confronto con menhir bretoni, stele antropomorfe alpine)", "Storia delle religioni preistoriche (culto dei morti, simboli del 'capovolto')", "Storia dell'archeologia sarda (ruolo pionieristico di Enrico Atzeni)", "Architettura neoclassica sarda (Palazzo Aymerich, Gaetano Cima)"], "aneddoto": "La prima statua-menhir sarda fu trovata nel 1969 non in uno scavo programmato, ma isolata al margine di un sentiero di campagna: una scoperta quasi casuale che ha aperto un intero capitolo, prima sconosciuto, della preistoria sarda."}, "Parco Archeologico di Turris Libisonis": {"inquadramento": "Colonia romana (Colonia Iulia Turris Libisonis), l'unica in Sardegna abitata esclusivamente da cittadini romani, fondata presso l'attuale Porto Torres sulla foce del Riu Mannu. Seconda città sarda per importanza dopo Caralis nel III secolo, decadde con le invasioni vandaliche e fu sostituita da Sassari come centro di riferimento nel XIII secolo.", "nomiChiave": ["Giulio Cesare — tradizione la vuole fondatore nel 46 a.C., di ritorno dall'Africa dopo la battaglia di Tapso", "Palazzo di Re Barbaro — le Terme Centrali (fine III-inizio IV sec. d.C.), tradizionalmente associate al governatore Barbarus", "Santi Gavino, Proto e Gianuario — martiri turritani, secondo la tradizione condannati dal governatore Barbaro", "Domus di Orfeo e Domus dei Mosaici — residenze private con mosaici figurati", "Massimo Pallottino — archeologo che condusse gli scavi delle omonime terme nel 1941-42"], "daNonOmettere": ["Lo status unico della colonia: insieme a Usellus, unica in Sardegna composta esclusivamente da cittadini romani", "Il ruolo portuale strategico sulle rotte tra Roma e il Mediterraneo nord-occidentale, culto di Iside legato ai marinai", "La distinzione tra le tre terme (Centrali/Palazzo di Re Barbaro, Maetzke, Pallottino) e le rispettive fasi cronologiche", "Il declino con le invasioni vandaliche e il progressivo spostamento del centro urbano verso Sassari nel Medioevo"], "collegamenti": ["Storia romana repubblicana e cesariana (fondazione legata a Giulio Cesare e alla guerra civile africana)", "Storia del cristianesimo in Sardegna (martirio dei santi turritani Gavino, Proto e Gianuario)", "Commercio marittimo romano (rotte tra Roma, Sardegna, Corsica; culto di Iside protettrice dei naviganti)", "Ingegneria termale romana (confronto tra le tre terme e con le terme di Fordongianus)"], "aneddoto": "Le imponenti Terme Centrali sono note popolarmente come 'Palazzo di Re Barbaro', dal nome del governatore romano che la tradizione cristiana ricorda come il persecutore dei santi Gavino, Proto e Gianuario: un edificio termale trasformato dalla devozione popolare nella dimora leggendaria di un tiranno."}, "Area Archeologica di Agrigento": {"inquadramento": "Il Parco Archeologico e Paesaggistico della Valle dei Templi, istituito con legge regionale nel 2000, tutela l'intera area monumentale dell'antica Akragas: circa 1.300 ettari che ne fanno uno dei più estesi parchi archeologici del Mediterraneo. Patrimonio UNESCO dal 1997, ha ricevuto nel 2015 la Dichiarazione di Eccezionale Valore Universale (DEVU) per la qualità dei servizi ai visitatori.", "nomiChiave": ["Akragas — fondata dai Geloi nel 580 a.C. circa, cinta muraria di circa 450 ettari", "Tempio della Concordia — il meglio conservato, trasformato in basilica cristiana nel 597 d.C. dal vescovo Gregorio II", "Tommaso Fazello — storico cinquecentesco a cui si deve l'attribuzione (convenzionale) dei nomi moderni ai templi", "Giardino della Kolymbethra — antica riserva idrica, oggi giardino di agrumi e mandorli, tappa del Grand Tour", "Necropoli paleocristiane — testimonianza della lunga vita del sito oltre l'età greco-romana", "Museo Archeologico Regionale \"Pietro Griffo\""], "daNonOmettere": ["L'errata ma persistente tradizione ottocentesca dei nomi dei templi (Concordia, Giunone, ecc.), attribuzioni convenzionali non confermate dalle fonti antiche", "La conversione del Tempio della Concordia in chiesa cristiana come chiave della sua eccezionale conservazione", "Il riconoscimento DEVU del 2015, distinto dall'iscrizione UNESCO del 1997, legato alla qualità della fruizione"], "collegamenti": ["Storia della colonizzazione greca in Sicilia (fondazione di Akragas dai Geloi)", "Storia della conservazione architettonica (trasformazione di templi pagani in chiese, un fenomeno diffuso nel Mediterraneo)", "Botanica mediterranea e paesaggio storico (Giardino della Kolymbethra)", "Storia del Grand Tour e della riscoperta romantica dell'antichità (Goethe ad Agrigento, 1787)"], "aneddoto": "Nel 1787 Goethe si soffermò a lungo davanti al Tempio della Concordia durante il suo viaggio in Sicilia, ammirandone la sopravvivenza ai secoli pur criticando la qualità di un restauro settecentesco: la Valle dei Templi era già, oltre due secoli fa, tappa obbligata del viaggio colto in Italia."}, "Città tardo barocche della Val di Noto": {"inquadramento": "Sito UNESCO seriale (2002) di otto città della Sicilia sud-orientale — Caltagirone, Militello in Val di Catania, Catania, Modica, Noto, Palazzolo Acreide, Ragusa e Scicli — ricostruite dopo il devastante terremoto del Val di Noto (1693), in uno stile tardo barocco omogeneo che rappresenta l'ultima grande fioritura del Barocco europeo.", "nomiChiave": ["Catania — ricostruita sullo stesso sito, con nuovo piano urbanistico geometrico sulle macerie", "Pietra calcarea locale (rosata e dorata) — materiale caratterizzante l'omogeneità cromatica", "Criterio UNESCO (i): genio creativo umano nell'ultima fioritura del Barocco europeo"], "daNonOmettere": ["La distinzione tra le città ricostruite sullo stesso sito (Catania) e quelle trasferite altrove (Noto)", "L'omogeneità stilistica come conseguenza diretta della contemporaneità della ricostruzione, non di un'unica scuola architettonica", "Il rischio sismico persistente dell'area, richiamato esplicitamente nella motivazione UNESCO"], "collegamenti": ["Storia sismica della Sicilia orientale (uno dei terremoti più devastanti della storia italiana)", "Urbanistica barocca e ricostruzione p
