ost-catastrofe (confronto tra approcci di rifondazione e ricostruzione in situ)", "Architettura tardo barocca siciliana (sintesi di influssi romani, francesi e spagnoli)", "Storia sociale del Settecento siciliano (collaborazione tra clero, aristocrazia, nuovi ceti urbani e governo spagnolo)"], "aneddoto": "Noto non fu semplicemente restaurata dopo il sisma del 1693: fu abbandonata e ricostruita da zero a 8 chilometri di distanza, su un sito completamente nuovo — un'intera città tardo barocca nata a tavolino nel giro di pochi decenni, senza stratificazioni precedenti."}, "Monte Etna": {"inquadramento": "Il vulcano attivo più alto d'Europa (circa 3.300 m), sulla costa orientale della Sicilia: uno stratovulcano con attività eruttiva documentata da almeno 2.700 anni, tra le registrazioni storiche di vulcanismo più lunghe al mondo. Patrimonio UNESCO naturale dal 2013, protetto dal Parco dell'Etna istituito nel 1987.", "nomiChiave": ["Valle del Bove — grande depressione sul versante orientale, generata dal collasso di un fianco del vulcano", "Wolfgang Sartorius von Waltershausen — realizzò la prima mappa geologica di un grande vulcano (metà Ottocento)", "Eruzione del 1669 — colata lavica che raggiunse Catania", "Mongibello — nome medievale dell'Etna, dall'arabo Jabal (\"monte\"), unito al latino Mons"], "daNonOmettere": ["Il criterio UNESCO (viii): testimonianza eccezionale di processi geologici in atto e di formazioni vulcaniche, non un criterio culturale", "La lunghissima documentazione storica dell'attività eruttiva (Tucidide, Diodoro Siculo, Pindaro tra le fonti antiche)"], "collegamenti": ["Vulcanologia e scienze della Terra (laboratorio naturale per la ricerca geofisica)", "Mitologia greca (Encelado, i Ciclopi, l'officina di Efesto/Vulcano localizzata sotto l'Etna)", "Storia di Catania (impatto delle colate laviche sulla città, eruzione del 1669)", "Storia della vulcanologia come disciplina scientifica (Waltershausen, Lyell)"], "aneddoto": "Per i greci antichi i boati e le eruzioni dell'Etna erano il respiro del gigante Encelado, sconfitto da Atena e sepolto vivo sotto la montagna: un mito che già nell'antichità cercava di dare un volto e un nome alla furia del vulcano più attivo d'Europa."}, "Palermo arabo-normanna e Cattedrali di Cefalù e Monreale": {"inquadramento": "Sito UNESCO seriale (2015) di nove monumenti — sette a Palermo, uno a Cefalù, uno a Monreale — che testimoniano la sintesi tra culture occidentale, islamica e bizantina fiorita nel Regno normanno di Sicilia (1130-1194 ca.). Un caso unico di convivenza multiculturale tradotta in un linguaggio architettonico e decorativo coerente e originale.", "nomiChiave": ["Palazzo Reale e Cappella Palatina — consacrata nel 1140, definita da Guy de Maupassant la chiesa più bella del mondo", "Cattedrale di Monreale — voluta da Guglielmo II (1172-1176 ca.), secondo ciclo musivo bizantino al mondo dopo Santa Sofia", "Cattedrale di Cefalù — fondata nel 1131 da Ruggero II", "Chiesa di Santa Maria dell'Ammiraglio (la Martorana) e Chiesa di San Cataldo", "Palazzo della Zisa — residenza di svago normanna in stile arabo", "Ruggero II e Guglielmo II d'Altavilla — sovrani normanni committenti principali"], "daNonOmettere": ["La convivenza di maestranze arabe, bizantine e latine al servizio della stessa committenza normanna, non una semplice giustapposizione di stili", "La distinzione tra i singoli monumenti: due palazzi, tre cattedrali, quattro chiese, un ponte", "L'elemento decorativo distintivo: mosaici a tessere, opus sectile, intarsi, muqarnas (decorazione ad alveoli d'ispirazione islamica)", "Il criterio UNESCO (ii): sintesi stilistica che crea nuovi concetti spaziali attraverso la rielaborazione coerente di elementi di culture diverse"], "collegamenti": ["Storia della Sicilia medievale (dominazione araba, conquista normanna dal 1072, Regno di Sicilia)", "Arte musiva bizantina (confronto tra Monreale, Cefalù, Ravenna e Santa Sofia)", "Storia della tolleranza religiosa e culturale medievale (convivenza di latini, greci, arabi, ebrei alla corte normanna)", "Palermo Capitale della Cultura 2018, riconoscimento legato anche a questo sito UNESCO"], "aneddoto": "Lo scrittore francese Guy de Maupassant, visitando la Cappella Palatina nell'Ottocento, la definì la chiesa più bella del mondo: un piccolo scrigno dove mosaici bizantini, soffitto ligneo a muqarnas islamici e pianta basilicale latina convivono senza contraddirsi."}, "Villa Romana del Casale": {"inquadramento": "Villa romana tardo-imperiale (prima metà del IV secolo d.C.) presso Piazza Armerina, considerata l'esempio supremo di residenza di lusso romana per la ricchezza e l'estensione dei suoi mosaici (circa 3.500 mq). Patrimonio UNESCO dal 1997, deve la sua eccezionale conservazione a una frana medievale che la sepolse fino alla riscoperta scientifica del 1950.", "nomiChiave": ["Gino Vinicio Gentili — archeologo che avviò gli scavi ufficiali nel 1950", "Corridoio della Grande Caccia — mosaico di circa 60 metri con la cattura di animali esotici in Africa per i giochi romani", "Sala delle Dieci Ragazze (o \"ragazze in bikini\") — celebre mosaico con atlete in abbigliamento sportivo", "Peristilio principale — 32 colonne corinzie, fontana centrale", "Frigidarium, tepidarium, calidarium — il complesso termale della villa", "Ipotesi sul proprietario — aristocratico senatorio romano, forse un governatore, secondo l'ipotesi oggi prevalente sulla committenza imperiale"], "daNonOmettere": ["Il paradosso conservativo: l'abbandono dopo la frana del XII secolo e la copertura di fango hanno preservato i mosaici meglio di molti siti mai sepolti", "La provenienza nordafricana ipotizzata per le maestranze musive, testimonianza degli scambi culturali nel Mediterraneo tardoantico", "I due criteri UNESCO: testimonianza di una cultura unificata trasmessa nell'impero (ii) e esempio supremo di residenza di lusso romana (iii)", "La continuità di vita del sito oltre l'età romana: riusi in epoca araba e normanna, documentati dalle recenti campagne di scavo"], "collegamenti": ["Arte musiva tardoantica (confronto con i mosaici di Ravenna e Aquileia, tecniche e committenza)", "Storia economica romana (villa come centro di un latifundium, economia rurale dell'Impero d'Occidente)", "Storia degli scambi mediterranei (influenza nordafricana, commercio di animali esotici per i ludi)", "Letteratura e memoria del luogo (citazioni di Vittorini e Piovene sulla scoperta della villa)"], "aneddoto": "Il celebre mosaico delle 'ragazze in bikini', che raffigura giovani atlete impegnate in esercizi ginnici con pesi e palloni, sorprende ogni volta i visitatori per quanto sembri sorprendentemente moderno: un promemoria che la storia del corpo e dello sport non è mai lineare come si crede."}, "Centro storico di San Gimignano": {"inquadramento": "Borgo medievale della Val d'Elsa, in Toscana, famoso per le case-torri costruite tra XI e XIII secolo dalle famiglie rivali che controllavano il libero comune (indipendente dal 1199). Patrimonio UNESCO dal 1990: delle circa 72 torri originarie ne sopravvivono 14, uniche testimonianze integre di una città feudale toscana dominata da fazioni in perenne conflitto.", "nomiChiave": ["Torre Grossa (54 m) — la più alta, completata nel 1311, unica interamente visitabile", "Torre Rognosa (51-52 m) — la più antica (1200 ca.), un tempo usata come prigione", "Torri gemelle dei Salvucci — famiglia guelfa, in sfida architettonica con gli Ardinghelli ghibellini", "Statuto comunale del 1255 — limite di altezza fissato sulla Torre Rognosa, spesso disatteso", "Domenico Ghirlandaio — ciclo di affreschi di Santa Fina nella Collegiata (1475)", "Via Francigena — asse di pellegrinaggio che rese la città tappa strategica tra Firenze e Roma"], "daNonOmettere": ["Il criterio UNESCO (iv): a differenza di Firenze, dove le istituzioni pubbliche prevalsero sul potere delle famiglie, a San Gimignano le torri private restano intatte come segno di un conflitto tra fazioni mai risolto in favore del comune", "La rivalità Ardinghelli (ghibellini) vs Salvucci (guelfi) come motore della competizione edilizia", "Il paradosso conservativo: il declino demografico dopo il 1353 (carestie, peste) ha bloccato lo sviluppo urbano, preservando l'aspetto medievale", "La distinzione tra le torri superstiti (14) e quelle originarie (fino a 72), molte 'scapitozzate' per rispettare gli statuti comunali"], "collegamenti": ["Storia comunale italiana (lotte tra guelfi e ghibellini, autonomia cittadina e sua fine sotto Firenze dal 1353)", "Storia dell'arte toscana (Ghirlandaio, Gozzoli, Taddeo di Bartolo nella Collegiata)", "Storia dei pellegrinaggi medievali (Via Francigena)", "Storia dell'agricoltura e del commercio medievale (produzione di zafferano, Vernaccia di San Gimignano, primo DOC italiano nel 1966)"], "aneddoto": "Nel 1255 il comune vietò di costruire torri più alte della Torre Rognosa, ma i Salvucci aggirarono la regola erigendo due torri gemelle affiancate, una accanto all'altra: se non potevano vincere in altezza, avrebbero vinto in numero, raddoppiando il proprio segno di potere sullo skyline cittadino."}, "Ponte Vecchio": {"inquadramento": "Il più antico ponte di Firenze sull'Arno, ricostruito nel 1345 dopo un'alluvione con tre arcate a sesto ribassato, celebre per le botteghe che lo occupano dal Medioevo e per il Corridoio Vasariano che lo sovrasta dal 1565. Unico ponte fiorentino a non essere stato distrutto dai tedeschi in ritirata nel 1944.", "nomiChiave": ["Corridoio Vasariano — passaggio sopraelevato di quasi un km, fatto costruire nel 1565 da Cosimo I de' Medici su progetto di Giorgio Vasari", "Ferdinando I de' Medici — nel 1593 impose che le botteghe fossero riservate a orafi e argentieri", "Torre dei Mannelli — unica torre superstite, aggirata dal Corridoio con un sistema di beccatelli per l'opposizione della famiglia proprietaria", "Madielle — vetrine sporgenti a sportelli ribaltabili delle botteghe orafe, aggiunte nel primo Settecento", "Busto di Benvenuto Cellini — monumento del 1901, opera di Raffaele Romanelli", "Gerhard Wolf — console tedesco a cui si attribuisce un ruolo nel salvare il ponte dalla distruzione del 1944"], "daNonOmettere": ["Il cambio di destinazione delle botteghe: da macellai, pescivendoli e conciatori (fino al 1593) a orafi e gioiellieri per volere di Ferdinando I, per eliminare i cattivi odori sotto il Corridoio Vasariano", "La distruzione degli edifici alle due estremità del ponte nel 1944 (per bloccarne l'accesso), mentre la struttura del ponte fu risparmiata", "La resistenza del ponte all'alluvione dell'Arno del 4 novembre 1966", "La funzione originaria del Corridoio Vasariano: permettere ai Medici di spostarsi tra Palazzo Vecchio e Palazzo Pitti senza attraversare le strade, in un clima politico ancora instabile"], "collegamenti": ["Storia dei Medici e del principato mediceo (Corridoio Vasariano, rapporto tra potere e sicurezza personale)", "Storia dell'arte orafa fiorentina (Benvenuto Cellini, tradizione orafa tuttora viva sul ponte)", "Storia del Novecento a Firenze (occupazione tedesca 1944, alluvione del 1966)", "Ingegneria dei ponti (tipologia ad arco ribassato, innovativa per l'epoca medievale)"], "aneddoto": "Quando Giorgio Vasari dovette far passare il Corridoio oltre la Torre dei Mannelli, l'unica famiglia che si oppose alla servitù dei Medici, fu costretto a deviare il percorso con una struttura a sbalzo sorretta da mensole (beccatelli): ancora oggi il corridoio granducale gira intorno a quella torre, prova visibile di un'opposizione che nemmeno il potere mediceo riuscì a piegare del tutto."}, "Piazza dei Miracoli": {"inquadramento": "Piazza del Duomo di Pisa, complesso di quattro edifici romanici (Cattedrale, Battistero, Camposanto, Torre Pendente) costruiti tra XI e XIV secolo fuori dalle mura cittadine, a simboleggiare la potenza della Repubblica Marinara di Pisa. Patrimonio UNESCO dal 1987, deve il nome popolare a Gabriele D'Annunzio, che nel romanzo \"Forse che sì, forse che no\" (1910) parlò di un \"prato dei Miracoli\".", "nomiChiave": ["Cattedrale di Santa Maria Assunta (1064) — massima espressione del romanico pisano", "Battistero di San Giovanni (1152) — il più grande d'Italia, progettato da Diotisalvi", "Camposanto Monumentale (1277) — cimitero che raccoglie, secondo la tradizione, terra portata da Gerusalemme dai crociati pisani", "Nicola e Giovanni Pisano — scultori dei pulpiti di Battistero e Duomo, precursori del Rinascimento scultoreo", "Galileo Galilei — battezzato nel Battistero, tradizionalmente legato alla Torre per i suoi esperimenti sulla caduta dei gravi"], "daNonOmettere": ["Il simbolismo dei tre momenti della vita: Battistero (nascita), Duomo (vita), Camposanto (morte)", "La causa tecnica della pendenza della Torre: cedimento di un sottosuolo instabile (sabbia, argilla, conchiglie), non un errore di progetto originario", "La scelta di costruire il complesso fuori dalle mura cittadine, segno di sicurezza e potenza della Repubblica di Pisa", "Il ruolo dei pulpiti di Nicola e Giovanni Pisano come snodo tra scultura gotica e rinascita classicista"], "collegamenti": ["Storia delle repubbliche marinare (potenza economica e militare di Pisa medievale)", "Storia della scultura gotica italiana (Nicola e Giovanni Pisano, precursori del Rinascimento)", "Storia della scienza (Galileo Galilei e la leggendaria osservazione del pendolo)", "Storia delle crociate (terra del Camposanto portata da Gerusalemme)"], "aneddoto": "La Torre Pendente iniziò a inclinarsi già al terzo piano, quando la costruzione era appena a un terzo del percorso: i costruttori successivi, invece di correggere l'errore, costruirono i piani seguenti leggermente storti in senso opposto per compensarlo, rendendo la torre stessa leggermente curva, non solo inclinata."}, "Assisi, Basilica di San Francesco": {"inquadramento": "Basilica doppia (inferiore e superiore) fatta costruire a partire dal 1228, due anni dopo la morte di Francesco, per volere di papa Gregorio IX. Custodisce nella cripta le spoglie del santo e ospita uno dei cicli pittorici più importanti della storia dell'arte italiana, tra Duecento e Trecento, con opere di Cimabue, Giotto, Simone Martini e Pietro Lorenzetti. Patrimonio UNESCO insieme agli altri luoghi francescani di Assisi.", "nomiChiave": ["Cimabue — affreschi del transetto della Basilica superiore (Crocifissioni, Evangelisti), 1277-1283 ca.", "Giotto — le 28 Storie di San Francesco nella navata della Basilica superiore (1290-1296 ca.)", "Simone Martini — Cappella di San Martino nella Basilica inferiore (1312-1320 ca.)", "Pietro Lorenzetti — affreschi del transetto sinistro della Basilica inferiore (1315-1320)", "Terremoto del 1997 — crollo di parte delle volte della Basilica superiore, restauro durato oltre cinque anni", "Legenda Major di san Bonaventura — fonte testuale delle Storie di San Francesco"], "daNonOmettere": ["La struttura a due chiese sovrapposte: Basilica inferiore (funzione sepolcrale, cripta con le reliquie) e Basilica superiore (luminosa, aerea)", "La rivoluzione pittorica di Giotto: spazio tridimensionale, naturalismo, superamento della bidimensionalità bizantina di Cimabue", "Il dibattito storiografico ancora aperto sull'attribuzione del ciclo delle Storie di San Francesco (Giotto o maestranze romane guidate da Cavallini)", "I danni del terremoto del 1997 e il lungo restauro (oltre 60.000 ore di lavoro), esempio di conservazione post-sisma"], "collegamenti": ["Storia dell'arte italiana (passaggio dal linguaggio bizantino di Cimabue al naturalismo di Giotto, precursore del Rinascimento)", "Storia dell'ordine francescano (dibattiti interni sull'uso delle immagini, ruolo di papa Nicolò IV, primo papa francescano)", "Storia della sismologia e del restauro (terremoto umbro-marchigiano del 1997)", "Letteratura agiografica medievale (Legenda Major di Bonaventura da Bagnoregio come fonte iconografica)"], "aneddoto": "Nello stesso ambiente della Basilica inferiore si possono confrontare a pochi passi di distanza gli affreschi di Cimabue e quelli di Giotto: un raro caso in cui è possibile vedere fianco a fianco, nello stesso cantiere, il linguaggio bizantino che si chiude e quello nuovo, tridimensionale, che sta per aprire la strada al Rinascimento."}, "Area megalitica di Saint-Martin-de-Corléans": {"inquadramento": "Santuario preistorico alla periferia di Aosta, scoperto casualmente nel 1969 durante scavi edilizi: un'area di circa un ettaro che documenta quasi 6.000 anni di frequentazione, dal Neolitico finale (4200 a.C.) al Medioevo. Oggi ospitato nel MegaMuseo (2016, riallestito 2023), la più vasta area megalitica coperta d'Europa.", "nomiChiave": ["Franco Mezzena e Rosanna Mollo — archeologi che riconobbero e scavarono il sito a partire dal 1969", "Stele antropomorfe — oltre 46 grandi lastre decorate, capolavori della statuaria preistorica europea", "Tomba 2 — grande dolmen su piattaforma triangolare, usato per un millennio, con i resti di 39 individui", "Pali totemici lignei — allineamenti di almeno 24 pali, fase più antica del santuario (inizio III millennio a.C.)", "Petit-Chasseur (Sion, Svizzera) — unico sito comparabile in Europa per tipologia e ricchezza", "Chiesa di Saint-Martin-de-Corléans (XII sec.) — segno di continuità del valore sacro del luogo fino al cristianesimo"], "daNonOmettere": ["Le fasi funzionali del sito: santuario a cielo aperto per il culto agricolo (V millennio a.C.), poi necropoli monumentale (fine III millennio a.C.)", "Il passaggio dai pali totemici in legno alle stele antropomorfe in pietra, come evoluzione del culto degli antenati", "Il riuso delle stele più antiche come materiale nelle tombe megalitiche successive", "Il rischio della scoperta: il sito fu individuato per caso durante scavi edilizi nel 1969 e salvato dalla cementificazione"], "collegamenti": ["Preistoria e megalitismo alpino ed europeo (confronto diretto con Petit-Chasseur in Svizzera)", "Storia delle religioni preistoriche (culto degli antenati, archeoastronomia, riti di fondazione)", "Storia dei Salassi e della Valle d'Aosta preromana (tradizione leggendaria della città di Cordela)", "Museologia contemporanea (allestimento del MegaMuseo, la \"Rampa del Tempo\")"], "aneddoto": "Nel giugno 1969 le ruspe stavano scavando le fondamenta di un condominio quando due archeologi, Rosanna Mollo e Franco Mezzena, notarono spuntare dal terreno la sommità decorata di una stele: un'osservazione casuale bastò a salvare dal cemento uno dei più importanti siti megalitici d'Europa."}, "Centro storico di Verona": {"inquadramento": "Città sull'Adige, municipio romano dal I secolo a.C., poi potente signoria sotto gli Scaligeri (XIII-XIV secolo) e per quattro secoli parte della Repubblica di Venezia. Patrimonio UNESCO dal 2000, come esempio eccezionale di città fortificata sviluppatasi ininterrottamente per oltre duemila anni, incorporando elementi artistici di ogni epoca.", "nomiChiave": ["Arena di Verona — anfiteatro romano del I sec. d.C., tuttora sede di spettacoli lirici internazionali", "Famiglia della Scala (Scaligeri) — signori di Verona nel XIII-XIV secolo, ricostruirono le mura cittadine", "Arche Scaligere — monumentali tombe gotiche della dinastia, con statue equestri", "Piazza delle Erbe e Piazza dei Signori — cuore della città, con Palazzo del Comune, Palazzo del Governo, Loggia del Consiglio", "Castelvecchio — fortezza scaligera sull'Adige", "Dedizione a Venezia (1405) — passaggio volontario alla Repubblica di Venezia, inizio di secoli di prosperità"], "daNonOmettere": ["Il criterio UNESCO (ii): sviluppo urbano continuo e ininterrotto per duemila anni, con elementi artistici di ogni periodo successivo integrati organicamente", "Le fasi dominanti: municipio romano, dominazioni ostrogota e longobarda, epoca carolingia, signoria scaligera, Repubblica di Venezia, dominazioni francese e austriaca, Unità d'Italia (1866)", "La distinzione tra i resti romani (Arena, porte monumentali) e la stratificazione medievale-rinascimentale (mura scaligere, palazzi)", "Il perimetro murario definito dagli Scaligeri nel Medioevo, rimasto sostanzialmente invariato fino al XX secolo"], "collegamenti": ["Storia delle signorie italiane (Scaligeri, confronto con altre signorie del Trecento)", "Storia della Repubblica di Venezia (dedizione volontaria di città di terraferma)", "Archeologia romana del Nord Italia (Arena tra i monumenti meglio conservati)", "Storia urbanistica (stratificazione continua come modello di conservazione, diverso da città ricostruite ex novo)"], "aneddoto": "L'Arena di Verona, costruita nel I secolo d.C. per i combattimenti gladiatori, non è mai diventata un rudere silenzioso: da oltre un secolo ospita l'opera lirica all'aperto, continuando a svolgere la stessa funzione per cui fu costruita duemila anni fa — riunire migliaia di persone per uno spettacolo."}, "Ponte di Rialto": {"inquadramento": "Il più antico dei quattro ponti sul Canal Grande di Venezia, ricostruito in pietra tra il 1588 e il 1591 su progetto di Antonio Da Ponte dopo secoli di versioni lignee crollate o incendiate. Fino al 1854 fu l'unico collegamento pedonale tra le due sponde del Canal Grande.", "nomiChiave": ["Antonio Da Ponte — architetto veneziano vincitore del concorso, sconfiggendo i progetti di Palladio, Michelangelo, Sansovino e Vignola", "Rivoaltus/Rivus altus — \"canale profondo\", origine del toponimo Rialto", "Crollo del 1444 — collasso del precedente ponte ligneo per il sovraffollamento durante una visita ufficiale", "Congiura di Bajamonte Tiepolo (1310) — distruzione parziale del ponte per rallentare l'inseguimento dei congiurati", "Vincenzo Scamozzi — architetto che criticò il progetto di Da Ponte, giudicandolo troppo audace per reggersi", "24 botteghe — negozi che occupano tuttora le due rampe del ponte, in origine soprattutto orafi e mercanti"], "daNonOmettere": ["La lunga sequenza di ponti precedenti: ponte di barche (XII sec.), struttura lignea con levatoio, crolli del 1310 e del 1444, incendi", "Il concorso cinquecentesco tra grandi architetti dell'epoca, vinto dal pragmatico progetto a campata unica di Da Ponte", "La scelta della campata unica (28 metri), motivata dalla necessità di lasciare libero il passaggio alle imbarcazioni, incluso il Bucintoro dogale", "Il costo elevato (250.000 ducati) e le critiche tecniche mai del tutto sopite, nonostante la stabilità dimostrata da oltre quattro secoli"], "collegamenti": ["Storia della Repubblica di Venezia (Rialto come cuore commerciale della Serenissima)", "Ingegneria rinascimentale (tecnica costruttiva su pali, gestione del peso su terreno lagunare)", "Storia dell'arte veneziana (vedute di Canaletto, rappresentazioni pittoriche del ponte)", "Storia politica veneziana (congiura di Bajamonte Tiepolo, 1310)"], "aneddoto": "L'architetto Vincenzo Scamozzi era così convinto che il progetto di Antonio Da Ponte fosse tecnicamente insostenibile da scommettere pubblicamente che il ponte sarebbe crollato: sono passati più di quattro secoli, e la scommessa di Scamozzi resta ancora da pagare."}, "Dolomiti": {"inquadramento": "Massiccio montuoso delle Alpi sudorientali, tra Veneto, Trentino-Alto Adige e Friuli-Venezia Giulia, formato da rocce carbonatiche (dolomia) originatesi circa 250 milioni di anni fa da una barriera corallina tropicale. Patrimonio Naturale UNESCO dal 2009, articolato in nove sistemi montuosi.", "nomiChiave": ["Enrosadira — fenomeno ottico per cui le pareti si tingono di rosa-rosso all'alba e al tramonto", "Monti Pallidi — antico nome locale delle Dolomiti, dal colore chiaro della roccia", "I nove sistemi UNESCO — tra cui Pelmo-Croda da Lago, Marmolada, Pale di San Martino, Dolomiti Settentrionali (Tofane, Cristallo)", "Cultura ladina — identità linguistica e culturale alpina profondamente radicata nelle valli dolomitiche", "Sci Club Cortina d'Ampezzo (1903) — tra le prime realtà a segnare lo sviluppo turistico-sportivo della zona"], "daNonOmettere": ["L'origine geologica: accumulo di conchiglie, coralli e alghe in un mare tropicale del Triassico, poi sollevamento orogenetico", "Il criterio UNESCO: valore geologico e geomorfologico eccezionale (varietà di formazioni carbonatiche, testimonianze del Mesozoico), non solo estetico", "La compresenza di tre identità culturali nelle valli: ladina, tirolese-germanica, italiana", "La distinzione tra area protetta ampia (Parco naturale delle Dolomiti d'Ampezzo, 11.200 ettari) e il sito UNESCO nel suo complesso (oltre 141.000 ettari sui nove sistemi)"], "collegamenti": ["Geologia e paleontologia (fossili marini triassici, storia della Terra)", "Storia degli sport di montagna (alpinismo, sci, arrampicata libera dal 1887 con Georg Winkler)", "Storia della Grande Guerra (fronte alpino, gallerie e mulattiere militari come la Strada delle 52 Gallerie)", "Antropologia alpina (culture ladina, tirolese e veneta a contatto nelle valli dolomitiche)"], "aneddoto": "Per quasi due secoli i geologi sapevano ricreare in laboratorio la dolomia solo con temperature elevatissime, mai a temperatura ambiente come doveva essere avvenuto in natura: il cosiddetto 'problema della dolomia' fu risolto solo nel 1995, osservando processi simili nelle saline di Abu Dhabi."}, "Museo Archeologico Nazionale di Napoli": {"inquadramento": "Uno dei più importanti musei archeologici al mondo, fondato nel 1777 da Ferdinando IV di Borbone e aperto nel 1816 nell'ex Palazzo degli Studi. Fonda le sue collezioni su tre nuclei: la statuaria della Collezione Farnese, i reperti degli scavi vesuviani (Pompei, Ercolano, Stabia, Oplonti) e la collezione egizia, la più antica d'Italia in senso cronologico.", "nomiChiave": ["Alessandro Farnese (poi papa Paolo III) — avviò la collezione dal 1534 con gli scavi del Foro Romano e dell'Hadrianeum", "Toro Farnese ed Ercole Farnese — colossali sculture marmoree, copie romane di originali greci", "Mosaico di Alessandro (Battaglia di Isso) — dalla Casa del Fauno di Pompei", "Naoforo Farnese — statua egizia della XXVI dinastia, presente a Napoli già dal 1803", "Collezione Borgia — acquisita nel 1817, nucleo fondante della sezione egizia (la terza in Italia per importanza dopo Vaticani e Torino)", "Gabinetto Segreto — collezione di opere a soggetto erotico da Pompei ed Ercolano, allestita da Arditi nel 1819"], "daNonOmettere": ["La distinzione tra i tre grandi nuclei collezionistici: Farnese (statuaria romana da Roma), vesuviano (Pompei/Ercolano/Stabia/Oplonti) ed egizio (Borgia, Picchianti)", "Il percorso istituzionale: Real Museo (1777) → Real Museo Borbonico (1816) → Museo Nazionale (1860, post-Unità)", "La provenienza del Toro Farnese e dell'Ercole Farnese come copie romane di prototipi greci (pratica copista come pari dignità artistica)"], "collegamenti": ["Storia del collezionismo rinascimentale (Farnese, scavi romani del Cinquecento)", "Archeologia vesuviana (Pompei, Ercolano, eruzione del 79 d.C.)", "Egittologia e collezionismo settecentesco (cardinale Stefano Borgia, viaggiatore Picchianti)", "Storia dei Borbone di Napoli (Carlo di Borbone, Ferdinando IV, politica culturale illuminista)"], "aneddoto": "La Tazza Farnese, coppa in agata di età ellenistica, ha attraversato una storia quasi incredibile: dal tesoro di Cleopatra, forse fino alla corte di Lorenzo il Magnifico, prima di entrare nella collezione Farnese nel 1586 per eredità di Margherita d'Austria — un oggetto che ha visto sfilare duemila anni di potere prima di fermarsi in una teca a Napoli."}, "Museo di Capodimonte": {"inquadramento": "Reggia settecentesca sulla collina di Capodimonte a Napoli, fatta costruire da Carlo di Borbone dal 1738 per ospitare la Collezione Farnese ereditata dalla madre Elisabetta. Oggi galleria nazionale (seconda pinacoteca d'Italia dopo gli Uffizi) e appartamento reale, circondata dal Real Bosco, il più grande parco pubblico di Napoli.", "nomiChiave": ["Collezione Farnese — dipinti di Tiziano, Raffaello, Parmigianino, Correggio ereditati da Elisabetta Farnese", "Danae di Tiziano e La Flagellazione di Caravaggio — capolavori simbolo del museo", "Giovanni Antonio Medrano — primo architetto della reggia, poi sostituito da Antonio Canevari e Ferdinando Fuga", "Salottino di Porcellana della regina Maria Amalia — boudoir interamente in porcellana policroma (1757-59)", "Arazzi della Battaglia di Pavia — tessuti a Bruxelles, donati a Carlo V d'Asburgo", "Vesuvius di Andy Warhol — punta di diamante della sezione di arte contemporanea"], "daNonOmettere": ["La distinzione tra Galleria Farnese (pittura rinascimentale/barocca), Appartamento Reale e sezione contemporanea", "Il trasferimento della statuaria Farnese al Museo Archeologico di Napoli, mentre la pinacoteca resta a Capodimonte: due destini diversi per la stessa collezione", "Il saccheggio napoleonico del 1799: Ferdinando IV portò con sé a Palermo le opere più preziose in fuga dalla Repubblica Partenopea", "La Real Fabbrica della Porcellana (1743), attiva nel Real Bosco, che dà il nome alla celebre porcellana di Capodimonte"], "collegamenti": ["Storia del collezionismo Farnese-Borbone (stesso nucleo del Museo Archeologico di Napoli)", "Il soggiorno napoletano di Caravaggio (1606-1610) e la Flagellazione come opera-chiave del periodo", "Storia delle manifatture regie europee (porcellana di Capodimonte, confronto con Meissen e Sèvres)", "Arte contemporanea e dialogo col patrimonio storico (Warhol, Burri nelle sale del museo)"], "aneddoto": "Quando nel 1799 fu proclamata la Repubblica Partenopea, re Ferdinando IV fuggì a Palermo a bordo della nave di Nelson portando con sé le opere più preziose della collezione: un salvataggio d'urgenza che ha segnato per sempre quali capolavori sarebbero rimasti a Napoli e quali avrebbero rischiato di non farvi mai ritorno."}, "Museo Nazionale di Ravenna": {"inquadramento": "Museo ospitato nell'ex monastero benedettino di San Vitale, accanto all'omonima basilica del VI secolo. Istituito nel 1885 (nucleo settecentesco dai monaci camaldolesi di Classe), raccoglie reperti romani, paleocristiani e bizantini, avori, icone, ceramiche e il ciclo di affreschi trecenteschi di Pietro da Rimini.", "nomiChiave": ["Bassorilievo di Augusto — scultura celebrativa di età claudia, tra i reperti romani più importanti", "Transenne e capitelli da San Vitale e San Michele in Africisco — testimonianze della scultura bizantina ravennate", "Sinopia di Sant'Apollinare in Classe — disegno preparatorio ritrovato sotto il mosaico absidale, diverso dall'opera finita", "Pietro da Rimini — autore del ciclo di affreschi trecentesco nel refettorio, dalla chiesa di Santa Chiara", "Dittico di Murano (VI secolo) e pannello con Apollo e Dafne (V secolo) — capolavori della collezione di avori", "Monaci camaldolesi di Classe — collezionisti settecenteschi all'origine del nucleo museale"], "daNonOmettere": ["La sede: ex monastero benedettino, requisito in epoca napoleonica, poi destinato a raccogliere le collezioni cittadine", "Il percorso cronologico: lapidario romano nel primo chiostro, sale sul Tardoantico e la Ravenna capitale, poi arti applicate (avori, ceramiche, icone, numismatica)", "Il collegamento diretto con i monumenti UNESCO ravennati: molti reperti (transenne, sinopie) provengono proprio da San Vitale e Sant'Apollinare in Classe", "La distinzione tra le collezioni archeologiche (piano terra) e le arti minori/decorative (piano superiore)"], "collegamenti": ["Storia tardoantica e bizantina di Ravenna (stesso contesto dei Monumenti Paleocristiani UNESCO)", "Storia del monachesimo benedettino e camaldolese (collezionismo erudito settecentesco)", "Arte dell'avorio tardoantico e bizantino (confronto con altre collezioni europee)", "Pittura trecentesca della scuola riminese (Pietro da Rimini)"], "aneddoto": "La sinopia — il disegno preparatorio — di Sant'Apollinare in Classe, ritrovata sotto l'intonaco dell'abside, raffigura pavoni e un canestro: ma il mosaico realizzato nel VI secolo è completamente diverso, con una processione di pecore al loro posto. Un cambio di programma iconografico congelato nel muro, secoli prima che venisse scoperto."}, "Musei Vaticani": {"inquadramento": "Il museo nazionale della Città del Vaticano, fondato da papa Giulio II nel 1506 e aperto al pubblico nel 1771 per volere di Clemente XIV. Una delle maggiori collezioni d'arte al mondo, che comprende la Cappella Sistina, le Stanze di Raffaello, il Museo Pio-Clementino e la Galleria delle Carte Geografiche, con circa 6,5 milioni di visitatori l'anno.", "nomiChiave": ["Papa Giulio II — fondatore, avviò la collezione con l'acquisizione del Laocoonte (1506)", "Gruppo del Laocoonte — scultura ellenistica ritrovata sull'Esquilino nel gennaio 1506, primo nucleo della raccolta", "Michelangelo — volta della Sistina (1508-12, Storie della Genesi) e Giudizio Universale (1535-41)", "Raffaello Sanzio — le quattro Stanze Vaticane, tra cui la Stanza della Segnatura con la Scuola di Atene", "Galleria delle Carte Geografiche — corridoio di 120 metri con mappe cinquecentesche dell'Italia"], "daNonOmettere": ["L'episodio fondativo: il ritrovamento del Laocoonte nel 1506 e il suo immediato ingresso nelle collezioni pontificie", "Il percorso cronologico della decorazione della Sistina: prima i maestri del Quattrocento (Botticelli, Perugino, Ghirlandaio), poi Michelangelo", "L'episodio del 1938: Pio XI fece chiudere musei e basilica durante la visita di Hitler a Roma, rifiutandosi di riceverlo"], "collegamenti": ["Storia del mecenatismo papale rinascimentale (Giulio II, Leone X)", "Storia dell'arte classica e la sua riscoperta rinascimentale (Laocoonte, Apollo del Belvedere)", "Storia dell'arte del Cinquecento (Michelangelo, Raffaello, cantieri paralleli in Vaticano)", "Storia del Novecento e rapporti Chiesa-regimi totalitari (visita di Hitler, 1938)"], "aneddoto": "Nel maggio 1938, in occasione della visita di Hitler a Roma, papa Pio XI si ritirò a Castel Gandolfo e ordinò la chiusura totale di musei e basilica per l'intera durata del soggiorno del Führer: un gesto silenzioso ma inequivocabile, pensato perché il capo del Terzo Reich non potesse mettere piede in territorio vaticano nemmeno da visitatore."}, "Galleria Borghese": {"inquadramento": "Museo nella Villa Borghese Pinciana a Roma, nato dalla collezione del cardinale Scipione Borghese (1579-1633), nipote di papa Paolo V: mecenate di Bernini e collezionista di Caravaggio. Unica al mondo per concentrazione di sculture berniniane e tele caravaggesche, definita spesso 'il museo più bello del mondo'.", "nomiChiave": ["Cardinale Scipione Borghese — mecenate e collezionista, committente della villa e della raccolta", "Gian Lorenzo Bernini — Apollo e Dafne, Il ratto di Proserpina, David, Enea Anchise e Ascanio (1618-25)", "Caravaggio — sei dipinti tra cui Bacchino malato, Ragazzo con canestro di frutta, Madonna dei Palafrenieri", "Antonio Canova — Paolina Borghese come Venere Vincitrice (1805-08)", "Flaminio Ponzio e Giovanni Vasanzio — architetti della villa (1608-1613 e oltre)", "Camillo Borghese — cedette 523 opere a Napoleone nel 1807, oggi nucleo del Louvre"], "daNonOmettere": ["L'ambiguità del collezionismo di Scipione Borghese: acquisti, commissioni, ma anche sequestri e pressioni di potere (es. la Madonna dei Palafrenieri rifiutata da San Pietro)", "La cessione napoleonica del 1807: 523 opere passarono al Louvre e non sono mai tornate a Roma", "La distinzione tra il nucleo seicentesco di Scipione (Bernini, Caravaggio) e il riallestimento settecentesco di Marcantonio IV Borghese (Antonio Asprucci)", "Il valore della collezione come testimonianza pressoché intatta nel tempo, nonostante le spoliazioni"], "collegamenti": ["Storia del mecenatismo barocco romano (rapporto cardinali-artisti nel Seicento)", "Scultura barocca (Bernini, tecnica del marmo e resa del movimento)", "Storia napoleonica e spoliazioni d'arte (fondo Borghese al Louvre)", "Scultura neoclassica (Canova, mito di Paolina Borghese come Venere)"], "aneddoto": "Il primo busto di Scipione Borghese scolpito da Bernini rivelò una crepa nel marmo proprio a lavoro quasi ultimato: invece di abbandonarlo, Bernini ne scolpì un secondo in appena tre giorni. Oggi entrambi i busti sono esposti fianco a fianco, ma la critica considera superiore proprio la prima versione, quella difettosa."}, "Galleria Nazionale d'Arte Moderna e Contemporanea": {"inquadramento": "Fondata nel 1883, unico museo statale italiano dedicato esclusivamente all'arte moderna e contemporanea sin dall'origine. Dal 1911/1914 ha sede nel Palazzo delle Belle Arti a Valle Giulia (Cesare Bazzani). Circa 20.000 opere dal Neoclassicismo a oggi: da Canova a Van Gogh, dal Futurismo alla Pop Art.", "nomiChiave": ["Guido Baccelli — ministro dell'istruzione che nel 1883 ottenne l'istituzione della galleria", "Cesare Bazzani — architetto del Palazzo delle Belle Arti (1911, Esposizione Universale di Roma)", "Palma Bucarelli — soprintendente 1941-1975, prima donna a dirigere un museo pubblico italiano", "Antonio Canova — apre cronologicamente la collezione con opere neoclassiche", "Van Gogh, Cézanne, Monet, Klimt — principali presenze internazionali ottocentesche e postimpressioniste", "Futurismo, Arte Povera, Transavanguardia — correnti italiane del Novecento ampiamente rappresentate (Balla, Boccioni, Burri, Pistoletto)"], "daNonOmettere": ["La missione fondativa unica: raccogliere opere di artisti viventi senza limiti di provenienza regionale, stile o genere (1883)", "Il ruolo di Palma Bucarelli nell'aprire il museo all'arte d'avanguardia in anni di censura e conservatorismo culturale", "La chiusura forzata durante il fascismo/guerra (1942) e la rapida riapertura nel 1944, tra le prime istituzioni culturali italiane a farlo", "Il recente riallestimento tematico (non cronologico) che mette in dialogo opere di epoche diverse"], "collegamenti": ["Storia dell'Italia postunitaria e politiche culturali statali (prima collezione nazionale d'arte contemporanea)", "Storia delle avanguardie del Novecento (Futurismo, Metafisica, Informale, Arte Povera)", "Storia delle donne nelle istituzioni culturali italiane (Palma Bucarelli)", "Storia del fascismo e arte di regime (ampliamento 1933, uso per mostre di partito)"], "aneddoto": "Durante il fascismo il museo fu piegato a mostre ed eventi di partito; ma appena due anni dopo la sua chiusura bellica, nel 1944, fu tra le prime istituzioni culturali italiane a riaprire, guidata da Palma Bucarelli — la prima donna a dirigere un museo pubblico in Italia, che ne fece una finestra sull'arte d'avanguardia che il regime aveva cercato di oscurare."}, "Museo Nazionale Romano": {"inquadramento": "Istituito nel 1889 per raccogliere le antichità romane, oggi articolato in quattro sedi complementari: Palazzo Massimo (scultura e affreschi), Terme di Diocleziano (epigrafia e protostoria), Palazzo Altemps (collezionismo rinascimentale di scultura antica) e Crypta Balbi (archeologia urbana altomedievale).", "nomiChiave": ["Palazzo Massimo alle Terme — ricostruito 1883-86 da Camillo Pistrucci, acquistato dallo Stato nel 1981", "Pugilatore in riposo e Principe ellenistico — bronzi ellenistici, ex Terme di Diocleziano, oggi a Palazzo Massimo", "Palazzo Altemps — collezione Ludovisi, Galata Morente e Ares Ludovisi, aperto al pubblico nel 1997", "Terme di Diocleziano — complesso termale costruito in soli otto anni (298-306 d.C.) da Massimiano", "Crypta Balbi — ex teatro/foro commerciale romano, poi prigione medievale e caserma, oggi museo di archeologia urbana", "Niobide degli Horti Sallustiani — statua ellenistica nascosta sottoterra, forse per proteggerla dalle invasioni del V secolo"], "daNonOmettere": ["La logica delle quattro sedi: non una divisione casuale, ma per contesto e natura del materiale (scultura, epigrafia, collezionismo, archeologia urbana)", "La storia stratificata della Crypta Balbi: foro/teatro romano, poi conceria e prigione medievale, poi caserma, infine museo — un caso più unico che raro di archeologia della lunga durata", "Il collezionismo rinascimentale conservato a Palazzo Altemps, distinto dagli scavi ottocenteschi di Palazzo Massimo", "Le grandi collezioni confluite nel museo nel tempo: ex Museo Kircheriano, collezione Gnecchi, raccolta di Vittorio Emanuele III"], "collegamenti": ["Storia dell'archeologia romana e del collezionismo (Ludovisi, Altemps, Boncompagni)", "Scultura greca ed ellenistica (Pugilatore, Principe ellenistico, attribuzioni a Lisippo)", "Storia urbana di Roma nella lunga durata (Crypta Balbi, dall'antichità al Medioevo)", "Ingegneria termale romana (Terme di Diocleziano, le più grandi di Roma antica)"], "aneddoto": "La statua della Niobide fu ritrovata nel 1906 sepolta 11 metri sotto terra in un cubicolo degli Horti Sallustiani: probabilmente nascosta di proposito nel V secolo per salvarla dalla furia delle invasioni barbariche — un occultamento riuscito così bene da restare sconosciuto per oltre 1400 anni."}, "Museo Nazionale Etrusco di Villa Giulia": {"inquadramento": "Museo statale (ETRU) ospitato nella villa rinascimentale di papa Giulio III (1550-55, Vignola, Vasari, Ammannati), fondato nel 1889 per raccogliere le antichità pre-romane di Etruria meridionale, Lazio e Umbria. Il più importante museo al mondo dedicato alla civiltà etrusca e falisca.", "nomiChiave": ["Sarcofago degli Sposi — capolavoro in terracotta da Cerveteri (530-520 a.C.), ritrovato in 400 frammenti nel 1881", "Felice Barnabei — fondatore del museo, acquistò i frammenti del Sarcofago per 4.000 lire", "Apollo di Veio — statua in terracotta policroma dal Santuario di Portonaccio (VI sec. a.C.)", "Lamine d'oro di Pyrgi — iscrizioni bilingue etrusco-fenicie (V sec. a.C.), fonte diretta più antica sull'Italia preromana", "Cista Ficoroni — cista in bronzo da Palestrina (IV sec. a.C.)", "Collezione Castellani — ceramiche, bronzi e oreficerie antiche e moderne dei celebri orafi romani dell'Ottocento"], "daNonOmettere": ["L'allestimento topografico: le opere organizzate per centro di provenienza (Cerveteri, Veio, Vulci, Falerii)", "L'importanza documentaria delle lamine di Pyrgi: prova diretta dei rapporti tra Etruschi e Cartaginesi nel VI secolo a.C.", "La condizione paritaria della donna etrusca nel banchetto, leggibile nel Sarcofago degli Sposi (in contrasto con l'uso greco)", "La sede stessa come opera d'arte: villa di Giulio III con contributi di Vignola, Vasari, Ammannati e Michelangelo"], "collegamenti": ["Civiltà etrusca (necropoli di Cerveteri, Veio, Tarquinia)", "Rapporti Etruschi-Fenici-Cartaginesi nel Mediterraneo arcaico (lamine di Pyrgi)", "Storia del collezionismo antiquario italiano (collezione Castellani, orafi ottocenteschi)", "Architettura rinascimentale (villa di Giulio III, contributi di grandi maestri del Cinquecento)"], "aneddoto": "Il fondatore del museo, Felice Barnabei, acquistò per sole 4.000 lire quello che sembrava un mucchio di 'rottami fittili': quattrocento frammenti di terracotta trovati a Cerveteri. Da quei pezzi sparsi nacque, ricomposto, il Sarcofago degli Sposi — oggi il simbolo assoluto dell'arte etrusca."}, "Musei Capitolini": {"inquadramento": "Complesso museale sul Campidoglio (Palazzo dei Conservatori, Palazzo Nuovo, Tabularium), considerato il primo museo pubblico al mondo: fondato nel 1471 con la donazione di bronzi antichi da parte di papa Sisto IV, aperto ufficialmente al pubblico nel 1734 da Clemente XII.", "nomiChiave": ["Lupa Capitolina — bronzo del V sec. a.C. (bottega etrusca o magno-greca), i gemelli Romolo e Remo aggiunti in età rinascimentale", "Statua equestre di Marco Aurelio — unico grande bronzo equestre romano sopravvissuto, salvato da un'errata identificazione con Costantino", "Papa Sisto IV — donò nel 1471 i primi bronzi capitolini, atto fondativo del museo", "Colosso bronzeo di Costantino — frammenti (testa, mano) della statua colossale, esposti nell'Esedra di Marco Aurelio"], "daNonOmettere": ["Il primato storico: primo museo pubblico al mondo nel senso moderno, arte fruibile da tutti e non riservata ai proprietari", "Il destino della statua di Marco Aurelio: sopravvissuta perché creduta nel Medioevo un ritratto dell'imperatore cristiano Costantino, non del 'pagano' Marco Aurelio"], "collegamenti": ["Mitologia romana delle origini (Lupa Capitolina, Romolo e Remo)", "Storia del collezionismo pubblico e nascita del museo moderno (1471, 1734)", "Scultura romana imperiale (ritratti equestri, statue colossali)", "Storia dell'urbanistica rinascimentale (Piazza del Campidoglio, progetto michelangiolesco)"], "aneddoto": "La statua equestre di Marco Aurelio è l'unico grande bronzo equestre romano giunto fino a noi, e lo deve a un equivoco: nel Medioevo si credeva raffigurasse l'imperatore Costantino, il primo sovrano cristiano — e per questo fu risparmiata dalla fusione a cui vennero destinate quasi tutte le altre statue 'pagane' dell'antichità."}, "Palazzo Barberini e Palazzo Corsini – Gallerie Nazionali d'Arte Antica": {"inquadramento": "Le Gallerie Nazionali d'Arte Antica, un'unica istituzione su due sedi: Palazzo Barberini (progettato da Maderno, Borromini e Bernini per Urbano VIII) e Palazzo Corsini (XV secolo, già Palazzo Riario). Il nucleo nasce nel 1883 con la donazione della collezione Corsini; Palazzo Barberini apre come sede museale nel 1953.", "nomiChiave": ["Carlo Maderno, Francesco Borromini, Gian Lorenzo Bernini — architetti di Palazzo Barberini", "Pietro da Cortona — Allegoria della Divina Provvidenza, affresco del salone centrale, glorifica la famiglia Barberini", "La Fornarina di Raffaello — tra i capolavori simbolo di Palazzo Barberini", "Giuditta e Oloferne di Caravaggio — commissionato dal banchiere Ottavio Costa", "Regina Cristina di Svezia — ospitata a Palazzo Corsini nel Seicento, vi si trova la sua Alcova", "Beatrice Cenci (attr. Guido Reni) — ritratto tra i più celebri ed enigmatici della collezione"], "daNonOmettere": ["La distinzione tra le due sedi: Palazzo Corsini conserva l'unica quadreria settecentesca romana rimasta nel suo contesto originario, Barberini ha un allestimento cronologico moderno", "La dispersione della collezione Barberini originaria: vendite già dal Settecento, culminate nel decreto reale del 1934 che ne permise l'esportazione all'estero", "L'acquisto statale del 1949 e apertura del museo nel 1953, con recupero di circa 200 opere del fondo Barberini originario", "Le opere marcate con la sigla 'F' seguita da un numero progressivo: identificano ciò che resta del nucleo storico Barberini (es. la Fornarina, 'F1')"], "collegamenti": ["Storia del mecenatismo dei Barberini (papa Urbano VIII e la Roma barocca)", "Architettura barocca romana (collaborazione/rivalità tra Bernini e Borromini nello stesso cantiere)", "Storia del collezionismo romano (Corsini, Chigi, Torlonia confluite nelle Gallerie Nazionali)", "Storia delle spoliazioni d'arte in Italia (vendite Barberini all'estero negli anni Trenta)"], "aneddoto": "Delle centinaia di opere che un tempo componevano la collezione Barberini, oggi ne restano identificabili solo circa duecento: uno spopolamento iniziato già nelle liti fra eredi nel Settecento e completato da un decreto reale del 1934 che autorizzò i principi a vendere gran parte del patrimonio di famiglia all'estero."}, "Museo di Palazzo Reale": {"inquadramento": "Palazzo Balbi-Durazzo su via Balbi a Genova, costruito 1643-50 da Stefano Balbi, ampliato dai Durazzo (fine Seicento-inizio Settecento) e infine residenza sabauda dal 1824. Ceduto allo Stato nel 1919 da Vittorio Emanuele III, oggi museo con la celebre Galleria degli Specchi. Fa parte del sito UNESCO delle Strade Nuove e dei Palazzi dei Rolli.", "nomiChiave": ["Stefano Balbi — monopolista del commercio del mercurio, committente originario del palazzo", "Eugenio e Gio Luca Durazzo — acquistarono il palazzo nel 1679, promotori dell'ampliamento barocco", "Galleria degli Specchi — ispirata alle gallerie di Palazzo Colonna, Doria Pamphilj e alla Galerie des Glaces di Versailles", "Domenico Parodi — affrescò la volta della Galleria degli Specchi (1730) con scene mitologiche", "Carlo Felice di Savoia — acquistò il palazzo nel 1824, lo destinò a residenza sabauda genovese", "Ratto di Proserpina di Francesco Maria Schiaffino — gruppo marmoreo ispirato al Bernini, nella Galleria degli Specchi"], "daNonOmettere": ["Le tre fasi proprietarie: Balbi (Seicento), Durazzo (Sette-Ottocento), Savoia (1824-1919)", "La funzione simbolica della Galleria degli Specchi: sala per ricevere ospiti illustri (Filippo IV di Spagna, Giuseppe II d'Asburgo, Napoleone)", "L'interesse di Napoleone per l'acquisto del palazzo a inizio Ottocento, superato infine dall'offerta sabauda", "L'appartenenza al sistema UNESCO delle Strade Nuove e dei Palazzi dei Rolli (1997/2006), tra i pochi Rolli genovesi idonei a ospitare sovrani"], "collegamenti": ["Storia delle famiglie mercantili genovesi (Balbi, Durazzo, sistema dei Rolli)", "Storia della dinastia sabauda (residenza genovese dei Savoia dal 1824)", "Arte barocca e rococò genovese (Domenico e Filippo Parodi, Valerio Castello)", "Modelli di rappresentanza europea (confronto diretto con Versailles per la Galleria degli Specchi)"], "aneddoto": "La Galleria degli Specchi fu ambiente abbastanza prestigioso da ricevere, nel corso dei secoli, il re di Spagna Filippo IV, l'imperatore Giuseppe II d'Asburgo e persino Napoleone Bonaparte nel 1805 — che pochi anni prima aveva anche provato, senza riuscirci, a comprare l'intero palazzo."}, "Pinacoteca di Brera": {"inquadramento": "Pinacoteca nata come raccolta didattica dell'Accademia di Belle Arti (fondata da Maria Teresa d'Austria), trasformata da Napoleone in un 'Louvre italiano' e inaugurata come museo nel 1809, quando Milano era capitale del Regno d'Italia napoleonico. Raccoglie capolavori confiscati a chiese e conventi soppressi, oltre a opere trasferite dai territori annessi.", "nomiChiave": ["Sposalizio della Vergine di Raffaello (1504) — opera simbolo, requisita a Città di Castello ed entrata a Brera nel 1806", "Cristo morto di Andrea Mantegna — capolavoro di scorcio prospettico", "Pietà di Giovanni Bellini — vertice emotivo della collezione (1460 ca.)", "Pala di Brera (Pala Montefeltro) di Piero della Francesca — ultima opera nota dell'artista", "Napoleone come Marte Pacificatore di Antonio Canova — statua bronzea nel cortile d'onore (1809)"], "daNonOmettere": ["L'origine napoleonica: confisca di opere da chiese e monasteri soppressi, redistribuite tra Parigi e le nuove Gallerie italiane (Milano, Venezia, Bologna)", "La missione originaria di modello per gli allievi dell'Accademia, prima che diventasse un museo pubblico universale", "Le vicende belliche: opere evacuate durante la Seconda guerra mondiale, sale distrutte dai bombardamenti, riallestimento postbellico", "La separazione dall'Accademia di Belle Arti nel 1882, pur condividendo tuttora lo stesso Palazzo di Brera"], "collegamenti": ["Storia napoleonica e politiche culturali rivoluzionarie (redistribuzione dei beni ecclesiastici, musei come strumento illuminista)", "Storia della pittura italiana dal Trecento al Novecento (percorso che attraversa tutte le scuole regionali)", "Storia del collezionismo pubblico europeo (Brera come 'Louvre italiano')", "Bramante a Milano: gli affreschi degli Uomini d'arme, staccati da Casa Panigarola e oggi conservati in Pinacoteca"], "aneddoto": "Napoleone, guardando la statua che Canova aveva scolpito di lui come Marte Pacificatore, si lamentò di essere stato reso 'troppo bello'. Canova rispose, con diplomazia, che nemmeno un dio sarebbe risultato attraente vestito da soldato — e la statua, controversa fin dal principio, accoglie ancora oggi i visitatori nel cortile d'onore."}, "Cenacolo Vinciano": {"inquadramento": "L'Ultima Cena di Leonardo da Vinci (1494-98), dipinta su commissione di Ludovico il Moro nel refettorio del convento domenicano di Santa Maria delle Grazie a Milano. Patrimonio UNESCO dal 1980, è tra le opere pittoriche più celebri al mondo nonostante un secolare degrado dovuto alla tecnica sperimentale usata dall'artista.", "nomiChiave": ["Ludovico il Moro — duca di Milano, committente, volle fare di Santa Maria delle Grazie il mausoleo di famiglia degli Sforza", "Tecnica a secco su intonaco — Leonardo rifiutò il vero affresco per una tecnica sperimentale, causa del degrado precoce", "Donato Bramante — ristrutturò la tribuna della chiesa in parallelo al lavoro di Leonardo nel refettorio", "Giovanni Donato Montorfano — autore della Crocifissione sulla parete opposta del refettorio", "Restauro 1978-1999 — il più lungo della storia dell'arte, finanziato da Olivetti per circa 7 miliardi di lire", "Bombardamento del 1943 — colpì il refettorio, la parete del Cenacolo si salvò grazie a un muro protettivo di sacchi di sabbia"], "daNonOmettere": ["La causa tecnica del degrado: la tempera grassa su intonaco secco, scelta per permettere ripensamenti, non resse all'umidità del refettorio", "La distinzione tra le riletture ottocentesche/novecentesche (spesso invasive) e il restauro conservativo 1978-1999, che ha lasciato visibili le lacune anziché reintegrarle illusoriamente", "Il rischio bellico del 1943: il tetto e le pareti laterali del refettorio crollarono sotto i bombardamenti, ma la parete dipinta, protetta da sacchi di sabbia, resistette", "Le condizioni di visita contingentate (gruppi di 25 persone, 15 minuti, impianto di filtraggio dell'aria dal 1999) imposte dalla fragilità dell'opera"], "collegamenti": ["Storia della signoria sforzesca a Milano (mausoleo di famiglia, mecenatismo di Ludovico il Moro)", "Storia e tecnica della pittura murale rinascimentale (affresco vs tempera su intonaco secco)", "Storia della conservazione e del restauro (uno dei restauri più lunghi e documentati al mondo)", "Storia del Novecento e danni bellici al patrimonio italiano (bombardamento del 1943)"], "aneddoto": "Nel 1943 un bombardamento alleato fece crollare il tetto e due pareti del refettorio di Santa Maria delle Grazie: la parete su cui Leonardo aveva dipinto l'Ultima Cena rimase in piedi, protetta da un muro di sacchi di sabbia e impalcature allestito per precauzione qualche anno prima — un capolavoro salvato per un soffio da una guerra che ha raso al suolo tutto ciò che lo circondava."}, "Museo Egizio": {"inquadramento": "Fondato nel 1824 da Carlo Felice di Savoia con l'acquisto della collezione di Bernardino Drovetti (oltre 7.000 pezzi), è il più antico museo al mondo interamente dedicato alla civiltà egizia e il secondo per importanza dopo il Cairo. Sede nel Palazzo dell'Accademia delle Scienze a Torino, oltre 40.000 reperti su quattromila anni di storia.", "nomiChiave": ["Bernardino Drovetti — piemontese, console generale di Francia in Egitto, raccolse la collezione fondativa", "Carlo Felice di Savoia — acquistò la collezione Drovetti nel 1824 per 400.000 lire", "Ernesto Schiaparelli — direttore dal 1894, condusse gli scavi che portarono a Torino oltre 18.000 reperti (1903-1920)", "Tomba di Kha e Merit — scoperta intatta nel 1906 a Deir el-Medina, corredo funerario completo di un architetto reale e sua moglie", "Statua di Ramesse II — definita da Champollion 'l'Apollo del Belvedere egizio'", "Jean-François Champollion — decifratore dei geroglifici, in visita al museo proprio all'arrivo della collezione Drovetti"], "daNonOmettere": ["La distinzione tra il nucleo Drovetti (1824, acquisto regio) e gli scavi sistematici di Schiaparelli e Farina (1903-1937, regime di 'partage')", "L'unicità della Tomba di Kha e Merit: mai violata dai tombaroli in tremila anni, ritrovata con corredo intatto", "La protezione bellica: durante la Seconda guerra mondiale i reperti trasportabili furono spostati al Castello di Agliè"], "collegamenti": ["Storia dell'egittologia europea (moda del collezionismo post-napoleonico, decifrazione dei geroglifici)", "Storia sabauda (politica culturale di Carlo Felice, acquisti regi ottocenteschi)", "Archeologia e regime del 'partage' (spartizione dei reperti tra Egitto e missioni straniere fino al 1983)", "Vita quotidiana nell'antico Egitto (corredo di Kha e Merit come fonte diretta su cibo, abiti, mobili)"], "aneddoto": "Quando gli scavatori aprirono la porta sigillata della tomba di Kha, l'ispettore delle antichità raccontò che il meccanismo sembrava così moderno che Schiaparelli chiese la chiave al suo servitore — che rispose di non saperne nulla. Bussarono, e l'eco riverberò nella tomba silenziosa da oltre tremila anni."}, "Musei Reali": {"inquadramento": "Complesso museale unico (dal 2014-2016) che riunisce Palazzo Reale, Armeria Reale, Biblioteca Reale, Galleria Sabauda, Museo di Antichità, Giardini Reali e Cappella della Sacra Sindone: residenza dei Savoia dal 1563 al 1865. Parte del sito UNESCO delle Residenze Sabaude dal 1997.", "nomiChiave": ["Emanuele Filiberto di Savoia — trasferì la capitale ducale a Torino nel 1563, avviando la trasformazione del palazzo vescovile in residenza ducale", "Guarino Guarini — architetto della Cappella della Sacra Sindone (1667-94), capolavoro barocco", "Sacra Sindone — reliquia dei Savoia dal 1453, a Torino dal 1578", "Galleria Sabauda — pinacoteca inaugurata nel 1832, oltre 700 dipinti dal XIII al XX secolo (van Eyck, Mantegna, Rubens)", "Stigmate di San Francesco di Jan van Eyck — capolavoro fiammingo della Galleria Sabauda", "Incendio del 1997 — danneggiò gravemente la Cappella della Sindone, restauro concluso nel 2018"], "daNonOmettere": ["Il rischio corso dalla Sindone durante l'incendio del 1997: la reliquia fu salvata in extremis dai vigili del fuoco", "Il ruolo di Filippo Juvarra (Scala delle Forbici) e altri grandi architetti di corte nella stratificazione decorativa del palazzo", "La fine della funzione di residenza: 1865, trasferimento della capitale a Firenze dopo l'Unità d'Italia"], "collegamenti": ["Storia della dinastia sabauda e capitale di Torino (Emanuele Filiberto, Carlo Emanuele I)", "Storia religiosa e culto delle reliquie (Sacra Sindone, tradizione e scienza)", "Architettura barocca piemontese (Guarini, Juvarra, Castellamonte)", "Storia del collezionismo sabaudo e formazione della Galleria Sabauda (1832)"], "aneddoto": "Nella notte tra l'11 e il 12 aprile 1997 un incendio, causato da un corto circuito, devastò la Cappella della Sindone: i vigili del fuoco riuscirono a infrangere la teca blindata e a mettere in salvo la reliquia pochi istanti prima che il fuoco raggiungesse l'altare — la cappella riaprì al pubblico solo ventun anni dopo, nel 2018."}, "Museo Archeologico Nazionale (MArTA)": {"inquadramento": "Museo statale di Taranto, fondato nel 1887 nell'ex convento di San Pasquale di Baylon per tutelare i reperti emersi durante l'urbanizzazione ottocentesca della città. Custodisce una delle maggiori collezioni della Magna Grecia al mondo, celebre per gli 'Ori di Taranto'.", "nomiChiave": ["Luigi Viola — archeologo, primo direttore, ottenne l'istituzione del museo nel 1887", "Ori di Taranto — gioielli in oro (IV-III sec. a.C.), tra cui la Corona di Taranto con ninfe e satiri", "Zeus di Ugento — statua bronzea del VI sec. a.C.", "Veneri di Parabita — due sculture femminili preistoriche (14.000 a.C. ca.), tra le più antiche raffigurazioni umane dell'Europa meridionale", "Orfeo e le Sirene — gruppo scultoreo trafugato negli anni Settanta, rientrato in Italia dal Getty Museum dopo 50 anni", "Collezione Ricciardi — dipinti religiosi donati nel 1909 dal vescovo di Nardò, scuola napoletana (Luca Giordano, De Mura)"], "daNonOmettere": ["Il contesto fondativo: la scoperta e il rischio di dispersione dei reperti durante la costruzione del Borgo umbertino a fine Ottocento", "Il percorso espositivo cronologico: dal Paleolitico/Neolitico (secondo piano) alla Taranto greca ed ellenistica, fino a Roma e all'alto Medioevo (primo piano)", "La restituzione recente (2023) del gruppo di Orfeo e le Sirene, esempio di recupero internazionale di opere trafugate", "La distinzione tra i reperti identitari (Ori, Zeus di Ugento) e le collezioni private confluite nel museo (Ricciardi)"], "collegamenti": ["Storia della Magna Grecia e colonizzazione spartana (Taranto, unica colonia di Sparta)", "Oreficeria greca antica (tecniche, iconografia dei gioielli funerari)", "Storia del traffico illecito di opere d'arte e restituzioni internazionali (caso Orfeo e le Sirene, Getty Museum)", "Preistoria dell'Italia meridionale (Veneri di Parabita)"], "aneddoto": "Il gruppo scultoreo di Orfeo e le Sirene fu trafugato dall'Italia negli anni Settanta e finì per decenni esposto al Getty Museum di Los Angeles: solo nel 2023, cinquant'anni dopo il furto, è tornato a Taranto ed è oggi in esposizione permanente al MArTA — un ritorno a casa lungo mezzo secolo."}, "Museo Archeologico Nazionale": {"inquadramento": "Il principale museo archeologico della Sardegna, nato nell'Ottocento su iniziativa di Carlo Felice e ospitato dal 1993 nella Cittadella dei Musei 'Giovanni Lilliu' (ex regio Arsenale) a Cagliari. Racconta quasi 7000 anni di storia dell'isola, dalla preistoria all'alto Medioevo, con bronzetti nuragici e i Giganti di Mont'e Prama.", "nomiChiave": ["Bronzetti nuragici — centinaia di statuine votive in bronzo (guerrieri, sacerdoti, navicelle, modellini di nuraghe)", "Giganti di Mont'e Prama — statue in arenaria (oltre 2 m) di pugilatori, arcieri e guerrieri, scoperte casualmente nel 1974 presso Cabras", "Giovanni Lilliu — archeologo, 'padre dell'archeologia sarda', a cui è intitolata la Cittadella", "Stele di Nora — iscrizione fenicia (VIII-IX sec. a.C.), tra le prime attestazioni del nome 'Sardegna'", "'Madre dell'ucciso' (Pietà nuragica) — bronzetto che raffigura una madre con il figlio morto tra le braccia", "Su Nuraxi di Barumini — reperti in mostra dal principale sito nuragico, patrimonio UNESCO"], "daNonOmettere": ["La distinzione tra i piccoli bronzetti (oggetti votivi di uso rituale) e i grandi Giganti di pietra (probabile funzione commemorativa/eroica in ambito funerario)", "L'incertezza interpretativa sui Giganti: eroi caduti contro le invasioni puniche, personaggi eminenti, o divinità — dibattito aperto tra gli studiosi", "Le fasi storiche rappresentate: preistoria, civiltà nuragica (1600-700 a.C.), fenici e punici, Roma, alto Medioevo", "La sede stessa come palinsesto storico: cittadella spagnola, poi regio arsenale sabaudo, oggi polo museale (Cittadella dei Musei, 1979-1993)"], "collegamenti": ["Civiltà nuragica e preistoria sarda (confronto diretto con Su Nuraxi di Barumini)", "Colonizzazione fenicio-punica della Sardegna (Nora, Sulky, Monte Sirai)", "Storia dell'archeologia sarda (Giovanni Lilliu e la sua eredità scientifica)", "Storia dell'arte scultorea mediterranea (i Giganti come tra le più antiche sculture a tutto tondo del Mediterraneo)"], "aneddoto": "I Giganti di Mont'e Prama non furono trovati in piedi, ma frantumati in oltre cinquemila frammenti sepolti ai margini di una necropoli: qualcuno, in epoca antica, li aveva deliberatamente distrutti — forse i Punici vincitori, in un atto di damnatio memoriae contro gli eroi sconfitti di un mondo nuragico ormai al tramonto."}, "Museo Archeologico Regionale \"Paolo Orsi\"": {"inquadramento": "Museo di Siracusa tra i più importanti d'Europa per l'archeologia delle colonie greche di Sicilia: nato nel 1878 come Museo Archeologico Nazionale, oggi ha sede nella Villa Landolina (1988, arch. Franco Minissi) ed è intitolato a Paolo Orsi, che lo diresse per quarant'anni tra Otto e Novecento.", "nomiChiave": ["Paolo Orsi — direttore 1895-1934, figura fondativa dell'archeologia siciliana", "Venere Landolina (Venere Anadiomene) — copia romana da originale ellenistico, scoperta nel 1804 da Saverio Landolina", "Kouros di Lentini — grande statua greca arcaica in marmo (VI sec. a.C.), tra i capolavori della sezione greca", "Cavalluccio in bronzo — piccola statuetta dalla necropoli del Fusco, simbolo del museo", "Kourotrophos di Megara Iblea — statua acefala in calcare (metà VI sec. a.C.) raffigurante una dea madre che allatta due gemelli, quasi distrutta nel 1952 dagli operai che la rinvennero e poi ricostruita: opera distinta dalla Venere Landolina e dal Kouros di Lentini, spesso confusa con la prima per il soggetto simile", "Franco Minissi — architetto della sede attuale a Villa Landolina, inaugurata nel 1988", "Bernabò Brea — soprintendente che durante la Seconda guerra mondiale mise in salvo i reperti al Castello Eurialo"], "daNonOmettere": ["Il percorso istituzionale: Museo del Seminario (1780) → Museo Civico (1808) → Museo Archeologico Nazionale (1878-1886) → Museo Regionale Paolo Orsi (dal 1977, con il passaggio di competenze allo Stato regionale)", "La distinzione tra i due settori tematici in programma d'esame: preistoria/età del bronzo e colonie greche di Sicilia", "L'ammirazione suscitata storicamente dalla Venere Landolina, celebrata anche dallo scrittore Guy de Maupassant in visita a Siracusa", "La protezione bellica dei reperti al Castello Eurialo durante la Seconda guerra mondiale, per volontà di Bernabò Brea"], "collegamenti": ["Colonizzazione greca della Sicilia (Siracusa e le sue subcolonie: Eloro, Akrai, Kasmenai, Kamarina)", "Preistoria siciliana (culture di Castelluccio, Thapsos, Pantalica)", "Storia della scultura greca arcaica (Kouros, tipologie funerarie e votive)", "Storia dell'archeologia italiana (Paolo Orsi, metodo scientifico di scavo)"], "aneddoto": "La Venere Landolina prende il nome non da un'antica divinità ma dal suo scopritore ottocentesco, l'archeologo siracusano Saverio Landolina: un dettaglio che racconta come spesso, nella storia dei musei, il nome di un capolavoro antico finisca per appartenere a chi lo ha semplicemente ritrovato."}, "Galleria degli Uffizi": {"inquadramento": "Edificio fatto costruire nel 1560 da Cosimo I de' Medici per ospitare gli uffici amministrativi e giudiziari fiorentini (da cui 'uffizi'), su progetto di Giorgio Vasari. Trasformato in galleria personale da Francesco I nel 1581, oggi custodisce una delle maggiori collezioni di pittura italiana ed europea al mondo, dal Medioevo al Rinascimento.", "nomiChiave": ["Giorgio Vasari — architetto dell'edificio e del Corridoio Vasariano di collegamento con Palazzo Pitti", "Francesco I de' Medici — trasformò la loggia superiore in galleria personale (1581)", "Sandro Botticelli — La Nascita di Venere e La Primavera, opere simbolo del museo", "Bernardo Buontalenti — completò l'edificio (1580) e progettò la Tribuna, stanza-scrigno per i capolavori", "Vittoria della Rovere — ultima discendente dei duchi d'Urbino, arricchì la collezione con opere di Tiziano, Piero della Francesca, Raffaello", "Simonetta Vespucci — nobildonna genovese, musa ispiratrice del volto di Venere in Botticelli"], "daNonOmettere": ["La duplice origine funzionale: da sede amministrativa (uffizi) a galleria dinastica medicea (1581)", "La distinzione tra Nascita di Venere (su tela, tempera magra, 1483-85) e Primavera (su tavola), entrambe legate a Lorenzo di Pierfrancesco de' Medici", "Il ruolo della Tribuna del Buontalenti come microcosmo simbolico dei quattro elementi (terra, acqua, fuoco, cielo)", "L'arricchimento progressivo della collezione tramite eredità (Vittoria della Rovere) e acquisizioni (Cosimo III, Venere Medici)"], "collegamenti": ["Storia della signoria medicea e del mecenatismo fiorentino (Cosimo I, Francesco I)", "Filosofia neoplatonica del Rinascimento (Botticelli, Marsilio Ficino, Poliziano)", "Storia dell'architettura museale (nascita del concetto di 'galleria' come spazio espositivo dedicato)", "Storia della pittura italiana ed europea (percorso dal Medioevo al Seicento in un'unica collezione)"], "aneddoto": "Il volto sereno e malinconico di Venere nel celebre dipinto di Botticelli è, secondo la tradizione, quello di Simonetta Vespucci, la nobildonna di cui l'artista era segretamente innamorato: morta giovanissima quasi dieci anni prima che il quadro fosse dipinto, Botticelli la ritrasse a memoria, fissandone per sempre la bellezza in un'opera diventata icona assoluta."}, "Galleria dell'Accademia": {"inquadramento": "Museo fiorentino istituito nel 1784 dal Granduca Pietro Leopoldo come luogo di studio per gli allievi dell'Accademia delle Arti del Disegno. Deve la sua fama mondiale al David di Michelangelo, trasferito qui nel 1873, e alla Galleria dei Prigioni, con i quattro 'Schiavi' non finiti destinati alla tomba di Giulio II.", "nomiChiave": ["Prigioni (Schiavi) — quattro sculture non finite per la tomba di Giulio II, donate al Granduca da Leonardo Buonarroti (nipote dell'artista)", "Grotta del Buontalenti a Boboli — sede dei Prigioni dal 1586 al 1908, prima del trasferimento in Galleria", "Emilio De Fabris — architetto della Tribuna che accolse il David (progettata nove anni prima del suo completamento)", "Ratto delle Sabine di Giambologna — modello preparatorio in terra cruda, raro esempio cinquecentesco sopravvissuto", "San Matteo e Pietà di Palestrina — altre opere di Michelangelo conservate nella Galleria"], "daNonOmettere": ["Il progetto mai realizzato: la tomba monumentale di Giulio II, concepita con oltre 40 figure, di cui i Prigioni sono i soli frammenti superstiti rimasti a Firenze", "Il lungo peregrinare delle statue: dal laboratorio di Michelangelo, alla Grotta di Boboli (1586), infine alla Galleria (1908-09)", "L'attesa di nove anni del David in una cassa di legno, prima che la Tribuna fosse pronta ad accoglierlo (1873-1882)", "La distinzione tra i Prigioni fiorentini (solo abbozzati) e i due 'Schiavi' conservati al Louvre (molto più finiti)"], "collegamenti": ["Storia del mecenatismo papale (Giulio II, il progetto della tomba mai completato)", "Estetica del 'non finito' michelangiolesco (i Prigioni come riflessione sulla scultura come liberazione della forma)", "Storia dei Medici e Lorena a Firenze (Pietro Leopoldo, riorganizzazione delle accademie artistiche)", "Storia della tutela del patrimonio (trasferimento del David per proteggerlo dalle intemperie)"], "aneddoto": "I Prigioni di Michelangelo trascorsero oltre trecento anni all'aperto, esposti alle intemperie negli angoli della Grotta del Buontalenti nei giardini di Boboli — pensati per una tomba papale mai completata, finirono invece a fare da ornamento decorativo a una grotta artificiale, prima di trovare finalmente un museo tutto per loro nel 1908."}, "Palazzo Pitti, Giardino di Boboli e Ville medicee della Toscana": {"inquadramento": "Palazzo fatto costruire a metà Quattrocento dal banchiere Luca Pitti, rivale dei Medici, che finirono per acquistarlo nel 1549 e farne la loro residenza granducale. Dimora di tre dinastie (Medici, Asburgo-Lorena, Savoia), oggi complesso di più musei affacciato sul Giardino di Boboli, uno dei giardini all'italiana meglio conservati d'Europa.", "nomiChiave": ["Luca Pitti — banchiere fiorentino, committente originario del palazzo (metà XV secolo)", "Eleonora di Toledo — moglie di Cosimo I de' Medici, acquistò il palazzo nel 1549", "Pietro da Cortona — affrescò le Sale dei Pianeti della Galleria Palatina (1641-47) per Ferdinando II", "Galleria Palatina — oltre 550 dipinti allestiti 'alla quadreria', senza ordine cronologico moderno, con opere di Raffaello, Tiziano, Rubens", "Madonna della Seggiola di Raffaello — una delle opere più celebri della Galleria Palatina", "Vittorio Emanuele III — donò l'intero complesso allo Stato italiano nel 1919"], "daNonOmettere": ["Le tre dinastie residenti: Medici (dal 1549), Asburgo-Lorena (dal 1737), Savoia (1865-71, Firenze capitale)", "La distinzione tra Galleria Palatina (quadreria dei Medici) e Appartamenti Reali (vissuti fino ai Savoia)", "L'allestimento 'a quadreria' della Galleria Palatina: quadri appesi come li disposero i Medici, per mostrare potere più che per didattica cronologica", "Il programma decorativo delle Sale dei Pianeti di Pietro da Cortona: un'allegoria dell'educazione del principe attraverso i pianeti-divinità"], "collegamenti": ["Storia delle dinastie fiorentine e toscane (Medici, Lorena, Savoia)", "Storia della pittura italiana ed europea (la più grande raccolta di Raffaello al mondo)", "Storia della pittura barocca e del mecenatismo mediceo (Pietro da Cortona, i Medici committenti)"], "aneddoto": "Secondo Vasari, Luca Pitti volle un palazzo così smisurato che le finestre di una casa fiorentina qualunque ci sarebbero entrate come un normale portone: un gesto di rivalità verso i Medici che, ironicamente, finirono per comprare proprio quel palazzo dopo la caduta in disgrazia della famiglia Pitti."}, "Gallerie dell'Accademia": {"inquadramento": "Il principale museo di Venezia e la maggiore collezione al mondo di pittura veneta dal Trecento al Settecento, ospitato nel complesso della Scuola Grande e della chiesa di Santa Maria della Carità (Dorsoduro). Istituito con decreto napoleonico nel 1807 per raccogliere le opere di chiese e conventi soppressi, condivise fino al 2004 la sede con l'Accademia di Belle Arti.", "nomiChiave": ["Decreto napoleonico del 1807 — istituì le Gallerie nell'ex complesso della Carità dopo la soppressione di enti religiosi", "La Tempesta di Giorgione — capolavoro enigmatico, tra le opere più celebri del museo", "Giambattista Tiepolo — pittore di riferimento del Settecento veneziano, con opere nelle Gallerie", "Presentazione della Vergine al Tempio di Tiziano — ricollocata nella Sala dell'Albergo, suo contesto originario", "Andrea Palladio — progettò nel 1561 il Convento dei Canonici Lateranensi, parte del complesso museale", "Carlo Scarpa — curò l'ampliamento e il riallestimento museografico del dopoguerra (1944-1960)"], "daNonOmettere": ["L'origine dalla spoliazione napoleonica: opere confluite dopo la soppressione di chiese e conventi, non collezione dinastica come altri grandi musei italiani", "La scelta ottocentesca di rinunciare al 'museo universale' per concentrarsi sulla sola pittura veneta, che ha reso le Gallerie la raccolta più autorevole al mondo in questo campo", "La separazione tardiva (2004) tra l'Accademia di Belle Arti (scuola) e le Gallerie (museo), condivisa sede per quasi due secoli", "Il recupero (1987) dei frammenti dispersi del soffitto vasariano di Palazzo Corner, ricostruito dopo decenni sul mercato internazionale"], "collegamenti": ["Storia della pittura veneziana (Bellini, Giorgione, Tiziano, Tintoretto, Veronese, Tiepolo)", "Storia napoleonica e soppressioni ecclesiastiche (origine stessa della collezione)", "Architettura religiosa e conventuale veneziana (Palladio, Scuola Grande della Carità)", "Museografia del Novecento (restauro e riallestimento di Carlo Scarpa)"], "aneddoto": "Il soffitto dipinto da Giorgio Vasari per Palazzo Corner fu smantellato già a fine Settecento e i suoi pannelli finirono dispersi sul mercato antiquario internazionale: solo nel 1987, dopo due secoli, lo Stato italiano riuscì a ricomporre i frammenti superstiti, restituendo alle Gallerie un'opera che si credeva perduta per sempre."}, "Centro storico di Gerace": {"inquadramento": "Borgo medievale sulla costa ionica della Calabria (Reggio Calabria), edificato in altura dagli abitanti della vicina Locri in fuga dalle incursioni saracene (IX secolo). Conserva la cattedrale normanna più grande della Calabria e un impianto urbano sostanzialmente intatto.", "nomiChiave": ["Cattedrale dell'Assunta — la più grande chiesa normanna di Calabria (XI-XII sec.), con cripta a colonne di spoglio da Locri Epizefiri e Kaulonia", "Castello normanno-svevo — fortezza sulla sommità del borgo", "Chiesa di San Francesco d'Assisi — con altare barocco in marmi policromi", "Colonne di spoglio (spolia) — reimpiegate nella cattedrale, provenienti da templi greci della Locride", "Ruggero il Normanno — tradizionalmente legato alla fondazione/ampliamento della cattedrale"], "daNonOmettere": ["L'origine difensiva del borgo: fondato dagli abitanti di Locri in fuga dalle incursioni saracene, spostandosi in altura per sicurezza", "Il reimpiego di colonne antiche (spolia) nella cattedrale, provenienti dai templi greci della Locride, testimonianza della continuità del territorio", "La distinzione tra la cattedrale superiore e la cripta, con le sue file di colonne di spoglio di misure e stili eterogenei", "Il centro storico come esempio di continuità urbanistica medievale pressoché intatta"], "collegamenti": ["Storia delle incursioni saracene nel Mediterraneo medievale (origine dei borghi collinari)", "Architettura normanna nel Mezzogiorno (confronto con altre cattedrali normanne di Sicilia e Puglia)", "Archeologia della Magna Grecia (reimpiego delle colonne da Locri e Kaulonia)", "Storia medievale calabrese (feudi, castelli, incastellamento)"], "aneddoto": "Le colonne che sorreggono la cripta della cattedrale di Gerace non furono scolpite per quella chiesa: provengono dai templi greci di Locri Epizefiri e Kaulonia, e nessuna delle colonne è identica all'altra — un collage di spoglie antiche che i costruttori medievali assemblarono senza preoccuparsi dell'uniformità, purché la struttura reggesse."}, "Museo e Parco Archeologico di Locri Epizefiri": {"inquadramento": "Colonia greca fondata alla fine dell'VIII secolo a.C. da coloni della Locride centrale, sulla costa ionica calabrese: prima città greca a dotarsi di un codice scritto di leggi (Zaleuco, VII sec. a.C.) e importante centro religioso legato al culto di Persefone.", "nomiChiave": ["Zaleuco — legislatore locrese, autore del primo codice scritto di leggi del mondo greco (metà VII sec. a.C.)", "Santuario di Persefone (Mannella) — celebre per i Pinakes, tavolette votive in terracotta", "Tempio di Marasà — dedicato ad Afrodite/dee della Locride, in stile dorico", "Pinakes locresi — placchette votive dipinte, fonte iconografica fondamentale sui riti nuziali e sul culto di Persefone", "Museo Archeologico di Locri — raccoglie i reperti degli scavi urbani ed extraurbani"], "daNonOmettere": ["Il primato legislativo di Zaleuco: Locri fu la prima polis greca a darsi leggi scritte, non tramandate solo oralmente", "Il ruolo particolare della donna nella società locrese, riflesso nei Pinakes e in fonti antiche (diritto di successione per via femminile)", "La distinzione tra area urbana (templi, teatro, mura) e santuari extraurbani (Persefone alla Mannella, Afrodite a Marasà)", "Le colonne di Locri reimpiegate a Gerace, segno della lunga vita 'postuma' dei materiali della città antica"], "collegamenti": ["Storia del diritto antico (codice di Zaleuco, precedente a quello di Dracone ad Atene)", "Religione greca e culti misterici (Persefone, riti di passaggio femminili)", "Storia della Magna Grecia ionica (rapporti con Crotone, Reggio, Siracusa)", "Arte votiva greca (Pinakes come documento iconografico unico)"], "aneddoto": "Zaleuco impose al codice locrese una regola durissima: chi proponeva una modifica alla legge doveva presentarsi in assemblea con una corda al collo, pronto a essere impiccato se la proposta fosse stata respinta. Un deterrente estremo contro le riforme avventate, che secondo la tradizione mantenne le leggi di Locri stabili per secoli."}, "Cattolica di Stilo": {"inquadramento": "Piccola chiesa bizantina (IX-X secolo) incastonata nella roccia del monte Consolino, sopra il borgo di Stilo (Reggio Calabria): tra i più importanti e meglio conservati esempi di architettura bizantina in Calabria, a pianta quadrata con cinque cupolette.", "nomiChiave": ["Pianta a croce greca inscritta con cinque cupole — schema architettonico di ascendenza costantinopolitana", "Colonne di spoglio in marmo e granito — di reimpiego romano, con capitelli eterogenei", "Affreschi bizantini frammentari — tracce di decorazione pittorica all'interno", "Monaci basiliani — comunità monastica greco-bizantina che frequentò la chiesa nel Medioevo", "Tommaso Campanella — filosofo nato a Stilo (1568), città legata anche a questo pensatore rinascimentale"], "daNonOmettere": ["Le dimensioni ridotte dell'edificio (circa 7x7 metri) rispetto all'importanza storico-artistica: una piccola chiesa che condensa modelli architettonici bizantini complessi", "La funzione originaria probabilmente legata al monachesimo greco-bizantino diffuso in Calabria
